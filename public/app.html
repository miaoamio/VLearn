// ================================================================
// HAMBURGER RECIPE SYSTEM - Layer-based model
// ================================================================
const INGREDIENTS = [
  { id: 'cheese', name: '芝士', img: 'img/cheese.webp' },
  { id: 'patty', name: '牛肉', img: 'img/patty.webp' },
  { id: 'lettuce', name: '生菜', img: 'img/lettuce.webp' },
  { id: 'tomato', name: '西红柿', img: 'img/tomato.webp' }
];

// AI 帮厨可能产出的坏食材（AI 幻觉）
const BAD_INGREDIENT = 'bad';
const BAD_IMG = 'img/bad.webp';

function getIngredientImg(id) {
  if (id === BAD_INGREDIENT) return BAD_IMG;
  const found = INGREDIENTS.find(i => i.id === id);
  return found ? found.img : 'img/patty.webp';
}

function getIngredientName(id) {
  if (id === BAD_INGREDIENT) return 'AI 幻觉物';
  const found = INGREDIENTS.find(i => i.id === id);
  return found ? found.name : '未知';
}

function isBadRecipe(recipe) {
  return recipe && recipe.includes(BAD_INGREDIENT);
}

// Diff two recipe arrays (layer-by-layer comparison)
function diffRecipes(oldRecipe, newRecipe) {
  const result = [];
  const maxLen = Math.max(oldRecipe.length, newRecipe.length);
  for (let i = 0; i < maxLen; i++) {
    if (i >= oldRecipe.length) {
      result.push({ type: 'added', value: newRecipe[i], index: i });
    } else if (i >= newRecipe.length) {
      result.push({ type: 'removed', value: oldRecipe[i], index: i });
    } else if (oldRecipe[i] !== newRecipe[i]) {
      // 跟真实 git diff 一致：modification = 删除旧行 + 新增新行
      result.push({ type: 'removed', value: oldRecipe[i], index: i });
      result.push({ type: 'added', value: newRecipe[i], index: i });
    } else {
      result.push({ type: 'same', value: newRecipe[i], index: i });
    }
  }
  return result;
}

// Compute diff summary counts
function diffSummary(oldRecipe, newRecipe) {
  const diff = diffRecipes(oldRecipe, newRecipe);
  let added = 0, removed = 0;
  for (const d of diff) {
    if (d.type === 'added') added++;
    else if (d.type === 'removed') removed++;
  }
  return { added, removed, modified: 0 };
}

// Generate realistic conventional commit message from recipe diff
function generateRealisticMsg(oldRecipe, newRecipe) {
  const diff = diffRecipes(oldRecipe, newRecipe);
  const added = diff.filter(d => d.type === 'added');
  const removed = diff.filter(d => d.type === 'removed');

  // 检测同一 index 同时有 removed 和 added 的情况（即替换）
  const replacedIndices = new Set();
  for (const r of removed) {
    if (added.some(a => a.index === r.index)) replacedIndices.add(r.index);
  }
  const pureAdded = added.filter(d => !replacedIndices.has(d.index));
  const pureRemoved = removed.filter(d => !replacedIndices.has(d.index));
  const replacePairs = [...replacedIndices].map(idx => ({
    index: idx,
    oldValue: removed.find(d => d.index === idx).value,
    newValue: added.find(d => d.index === idx).value
  }));

  let type, desc;
  if (pureAdded.length > 0 && pureRemoved.length === 0 && replacePairs.length === 0) {
    type = 'feat';
    if (pureAdded.length === 1) {
      desc = `在第${pureAdded[0].index + 1}层添加${getIngredientName(pureAdded[0].value)}`;
    } else {
      desc = `添加${pureAdded.map(d => getIngredientName(d.value)).join('、')}共${pureAdded.length}层新食材`;
    }
  } else if (pureRemoved.length > 0 && pureAdded.length === 0 && replacePairs.length === 0) {
    type = 'refactor';
    if (pureRemoved.length === 1) {
      desc = `移除第${pureRemoved[0].index + 1}层${getIngredientName(pureRemoved[0].value)}，精简配方结构`;
    } else {
      desc = `移除${pureRemoved.map(d => getIngredientName(d.value)).join('、')}，精简${pureRemoved.length}层冗余食材`;
    }
  } else if (replacePairs.length > 0 && pureAdded.length === 0 && pureRemoved.length === 0) {
    type = replacePairs.length > 1 ? 'refactor' : 'fix';
    if (replacePairs.length === 1) {
      desc = `第${replacePairs[0].index + 1}层${getIngredientName(replacePairs[0].oldValue)}替换为${getIngredientName(replacePairs[0].newValue)}，优化口感层次`;
    } else {
      desc = `调整${replacePairs.map(d => `第${d.index+1}层`).join('、')}食材搭配，重构口味平衡`;
    }
  } else {
    type = 'feat';
    const parts = [];
    if (replacePairs.length) parts.push(`替换${replacePairs.map(d => getIngredientName(d.oldValue) + '→' + getIngredientName(d.newValue)).join('、')}`);
    if (pureAdded.length) parts.push(`新增${pureAdded.map(d => getIngredientName(d.value)).join('、')}`);
    if (pureRemoved.length) parts.push(`移除${pureRemoved.map(d => getIngredientName(d.value)).join('、')}`);
    desc = parts.join('，');
  }

  return `${type}(配方): ${desc}`;
}

// Three-way merge for variable-length recipes
function mergeRecipes(baseRecipe, oursRecipe, theirsRecipe) {
  // Use simplified positional merge
  const maxLen = Math.max(baseRecipe.length, oursRecipe.length, theirsRecipe.length);
  const result = [];
  const conflicts = [];

  for (let i = 0; i < maxLen; i++) {
    const base = i < baseRecipe.length ? baseRecipe[i] : undefined;
    const ours = i < oursRecipe.length ? oursRecipe[i] : undefined;
    const theirs = i < theirsRecipe.length ? theirsRecipe[i] : undefined;

    const oursChanged = ours !== base;
    const theirsChanged = theirs !== base;

    if (!oursChanged && !theirsChanged) {
      // Neither changed this layer
      if (base !== undefined) result.push(base);
    } else if (oursChanged && !theirsChanged) {
      // Only ours changed
      if (ours !== undefined) result.push(ours);
      // else: ours deleted it, don't push
    } else if (!oursChanged && theirsChanged) {
      // Only theirs changed
      if (theirs !== undefined) result.push(theirs);
    } else {
      // Both changed
      if (ours === theirs) {
        // Same change, no conflict
        if (ours !== undefined) result.push(ours);
      } else {
        // Conflict!
        conflicts.push({ index: result.length, ours, theirs, base });
        result.push(ours !== undefined ? ours : theirs);
      }
    }
  }

  return { recipe: result, conflicts };
}

// Random operation for teammate
function randomRecipeOperation(recipe) {
  const ops = [];
  if (recipe.length > 1) ops.push('remove');
  ops.push('modify', 'add');
  const op = ops[Math.floor(Math.random() * ops.length)];
  const newRecipe = [...recipe];
  const randomIngredient = () => INGREDIENTS[Math.floor(Math.random() * INGREDIENTS.length)].id;

  if (op === 'modify' && newRecipe.length > 0) {
    const idx = Math.floor(Math.random() * newRecipe.length);
    let newIng;
    do { newIng = randomIngredient(); } while (newIng === newRecipe[idx]);
    newRecipe[idx] = newIng;
  } else if (op === 'add') {
    const ing = randomIngredient();
    newRecipe.push(ing);
  } else if (op === 'remove' && newRecipe.length > 1) {
    const idx = Math.floor(Math.random() * newRecipe.length);
    newRecipe.splice(idx, 1);
  }
  return newRecipe;
}

function findMergeBase(repo, id1, id2) {
  const ancestors1 = new Set();
  const q1 = [id1];
  while (q1.length) {
    const id = q1.shift();
    if (ancestors1.has(id)) continue;
    ancestors1.add(id);
    const c = repo.commits.get(id);
    if (c) q1.push(...c.parents);
  }
  const q2 = [id2];
  const vis = new Set();
  while (q2.length) {
    const id = q2.shift();
    if (vis.has(id)) continue;
    vis.add(id);
    if (ancestors1.has(id)) return id;
    const c = repo.commits.get(id);
    if (c) q2.push(...c.parents);
  }
  return null;
}

// ================================================================
// GIT REPO ENGINE
// ================================================================
class Repo {
  constructor() {
    this.commits = new Map();
    this.branches = new Map();
    this.HEAD = { type: 'branch', ref: 'main' };
    this.counter = 0;
    this.commitCounter = 0;
    this.branchColors = new Map();
    this.colorIdx = 0;
    this.remoteRefs = new Map();
  }

  init() {
    const id = this._id();
    this.commits.set(id, { id, msg: '初始提交', parents: [], recipe: [], author: null });
    this.branches.set('main', id);
    this.branchColors.set('main', '#2563eb');
  }

  _id() {
    const hex = '0123456789abcdef';
    let h = '';
    for (let i = 0; i < 40; i++) h += hex[Math.random() * 16 | 0];
    return h;
  }
  headCommit() { return this.HEAD.type === 'branch' ? this.branches.get(this.HEAD.ref) : this.HEAD.ref; }
  currentBranch() { return this.HEAD.type === 'branch' ? this.HEAD.ref : null; }

  getHeadRecipe() {
    const hc = this.commits.get(this.headCommit());
    // If HEAD is the initial commit (hidden from user), treat as empty
    if (hc && hc.parents.length === 0) return [];
    return hc ? [...hc.recipe] : [];
  }

  commit(prefix, userMsg, recipe, author) {
    const parent = this.headCommit();
    const id = this._id();
    this.commitCounter++;
    let msg = userMsg;
    if (!msg) {
      const parentCommit = this.commits.get(parent);
      const parentRecipe = parentCommit ? (parentCommit.parents.length === 0 ? [] : parentCommit.recipe) : [];
      msg = generateRealisticMsg(parentRecipe, recipe);
    }
    this.commits.set(id, { id, msg, parents: [parent], recipe: [...recipe], author: author || '小蓝' });
    if (this.HEAD.type === 'branch') this.branches.set(this.HEAD.ref, id);
    else this.HEAD.ref = id;
    return id;
  }

  branch(name) {
    if (this.branches.has(name)) throw new Error(`分支 "${name}" 已存在`);
    this.branches.set(name, this.headCommit());
    const branchColors = ['#16a34a','#d97706','#9333ea','#0891b2','#4f46e5','#ca8a04'];
    this.branchColors.set(name, branchColors[this.colorIdx++ % branchColors.length]);
  }

  checkout(name) {
    if (!this.branches.has(name)) throw new Error(`分支 "${name}" 不存在`);
    this.HEAD = { type: 'branch', ref: name };
  }

  deleteBranch(name) {
    if (!this.branches.has(name)) throw new Error(`分支 "${name}" 不存在`);
    if (this.currentBranch() === name) throw new Error('不能删除当前所在分支');
    this.branches.delete(name);
  }

  getMergeType(target) {
    if (!this.branches.has(target)) throw new Error(`分支 "${target}" 不存在`);
    const cur = this.currentBranch();
    if (!cur) throw new Error('HEAD 未指向分支');
    if (cur === target) throw new Error('不能合并自己');
    const curId = this.branches.get(cur);
    const targetId = this.branches.get(target);
    if (this._isAnc(targetId, curId)) return 'up-to-date';
    if (this._isAnc(curId, targetId)) return 'fast-forward';
    return 'merge';
  }

  merge(target, author) {
    if (!this.branches.has(target)) throw new Error(`分支 "${target}" 不存在`);
    const cur = this.currentBranch();
    if (!cur) throw new Error('HEAD 未指向分支');
    if (cur === target) throw new Error('不能合并自己');
    const curId = this.branches.get(cur);
    const targetId = this.branches.get(target);
    if (this._isAnc(targetId, curId)) throw new Error('已是最新');
    if (this._isAnc(curId, targetId)) { this.branches.set(cur, targetId); return { id: targetId, type: 'fast-forward' }; }

    const baseId = findMergeBase(this, curId, targetId);
    const baseCommit = this.commits.get(baseId);
    const curCommit = this.commits.get(curId);
    const targetCommit = this.commits.get(targetId);
    const baseRecipe = baseCommit ? baseCommit.recipe : [];
    const curRecipe = curCommit ? curCommit.recipe : [];
    const targetRecipe = targetCommit ? targetCommit.recipe : [];
    const { recipe: mergedRecipe, conflicts } = mergeRecipes(baseRecipe, curRecipe, targetRecipe);

    if (conflicts.length > 0) {
      return { type: 'recipe-conflict', curId, targetId, baseRecipe, curRecipe, targetRecipe, mergedRecipe, conflicts };
    }

    const id = this._id();
    this.commits.set(id, { id, msg: `合并 ${target} → ${cur}`, parents: [curId, targetId], recipe: mergedRecipe, author: author || '小蓝' });
    this.branches.set(cur, id);
    return { id, type: 'merge' };
  }

  mergeWithRecipe(target, recipe, author) {
    const cur = this.currentBranch();
    const curId = this.branches.get(cur);
    const targetId = this.branches.get(target);
    const id = this._id();
    this.commits.set(id, { id, msg: `合并 ${target} → ${cur}`, parents: [curId, targetId], recipe: [...recipe], author: author || '小蓝' });
    this.branches.set(cur, id);
    return { id, type: 'merge' };
  }

  reset(targetId) {
    const cur = this.currentBranch();
    if (!cur) throw new Error('HEAD 未指向分支');
    if (!this.commits.has(targetId)) throw new Error('目标提交不存在');
    this.branches.set(cur, targetId);
  }

  revert(targetId) {
    const headId = this.headCommit();
    const targetCommit = this.commits.get(targetId);
    if (!targetCommit) throw new Error('目标提交不存在');
    // Revert to the state of target's parent (undo that commit)
    const parentCommit = targetCommit.parents.length ? this.commits.get(targetCommit.parents[0]) : null;
    const revertRecipe = parentCommit ? [...parentCommit.recipe] : [];
    const id = this._id();
    this.commits.set(id, { id, msg: `撤销「${targetCommit.msg}」`, parents: [headId], recipe: revertRecipe, author: '小蓝' });
    if (this.HEAD.type === 'branch') this.branches.set(this.HEAD.ref, id);
    return id;
  }

  // Get commit history for current branch (for selection dialogs)
  getHistory() {
    const commits = [];
    let cId = this.headCommit();
    const visited = new Set();
    while (cId && !visited.has(cId)) {
      visited.add(cId);
      const c = this.commits.get(cId);
      if (!c) break;
      commits.push(c);
      cId = c.parents.length ? c.parents[0] : null;
    }
    return commits;
  }

  reachableCommits() {
    const vis = new Set();
    const q = [];
    for (const [, bid] of this.branches) q.push(bid);
    for (const [, rid] of this.remoteRefs) q.push(rid);
    while (q.length) {
      const id = q.shift();
      if (!id || vis.has(id)) continue;
      vis.add(id);
      const c = this.commits.get(id);
      if (c) q.push(...c.parents);
    }
    return vis;
  }

  _isAnc(a, d) {
    const vis = new Set(), q = [d];
    while (q.length) {
      const id = q.shift();
      if (id === a) return true;
      if (vis.has(id)) continue;
      vis.add(id);
      const c = this.commits.get(id);
      if (c) q.push(...c.parents);
    }
    return false;
  }

  getNewCommits(branch, other) {
    const tip = this.branches.get(branch);
    if (!tip) return [];
    const res = [], vis = new Set(), q = [tip];
    while (q.length) {
      const id = q.shift();
      if (vis.has(id)) continue;
      vis.add(id);
      if (!other.commits.has(id)) res.push(this.commits.get(id));
      const c = this.commits.get(id);
      if (c) q.push(...c.parents);
    }
    return res;
  }
}

// ================================================================
// GIT SYSTEM (local + remote)
// ================================================================
class GitSystem {
  constructor() {
    this.local = new Repo();
    this.teammate = new Repo();
    this.remote = new Repo();
    this.pullRequests = [];
    this.prCounter = 0;
  }

  createPR(author, source, target, title) {
    // 校验：source 分支必须已推送到远端
    if (!this.remote.branches.has(source)) throw new Error(`分支 "${source}" 尚未推送到远端，请先 push`);
    if (!this.remote.branches.has(target)) throw new Error(`目标分支 "${target}" 不存在于远端`);
    if (source === target) throw new Error('源分支和目标分支不能相同');
    // 检查是否已有相同的 open PR
    const existing = this.pullRequests.find(pr => pr.source === source && pr.target === target && pr.status === 'open');
    if (existing) throw new Error(`已有一个 ${source} → ${target} 的 PR 等待审核`);
    const pr = {
      id: ++this.prCounter,
      title: title || `${source} → ${target}`,
      source,
      target,
      author,
      status: 'open',
      reviews: [],
      createdAt: Date.now()
    };
    this.pullRequests.push(pr);
    return pr;
  }

  reviewPR(prId, reviewer, status, comment) {
    const pr = this.pullRequests.find(p => p.id === prId);
    if (!pr) throw new Error('PR 不存在');
    if (pr.status !== 'open') throw new Error('该 PR 已关闭或已合并');
    if (pr.author === reviewer) throw new Error('不能审核自己创建的 PR');
    // 替换该 reviewer 的历史评审（只保留最新一条）
    pr.reviews = pr.reviews.filter(r => r.reviewer !== reviewer);
    pr.reviews.push({ reviewer, status, comment: comment || '' });
    return pr;
  }

  mergePR(prId) {
    const pr = this.pullRequests.find(p => p.id === prId);
    if (!pr) throw new Error('PR 不存在');
    if (pr.status !== 'open') throw new Error('该 PR 已关闭或已合并');
    // 必须至少有一个 approved
    const approved = pr.reviews.some(r => r.status === 'approved');
    if (!approved) throw new Error('PR 尚未通过审核，需要至少一位审核人 Approve');
    // 在远端执行合并：source → target
    const sourceTip = this.remote.branches.get(pr.source);
    const targetTip = this.remote.branches.get(pr.target);
    if (!sourceTip || !targetTip) throw new Error('分支已被删除');
    // 如果 target 已包含 source（已是最新），直接标记合并
    if (this.remote._isAnc(sourceTip, targetTip)) {
      pr.status = 'merged';
      this.remote.branches.delete(pr.source);
      return { type: 'already-merged', pr };
    }
    // Fast-forward
    if (this.remote._isAnc(targetTip, sourceTip)) {
      this.remote.branches.set(pr.target, sourceTip);
      pr.status = 'merged';
      this.remote.branches.delete(pr.source);
      return { type: 'fast-forward', pr };
    }
    // 三路合并
    const baseId = findMergeBase(this.remote, targetTip, sourceTip);
    const baseRecipe = this.remote.commits.get(baseId)?.recipe || [];
    const targetRecipe = this.remote.commits.get(targetTip)?.recipe || [];
    const sourceRecipe = this.remote.commits.get(sourceTip)?.recipe || [];
    const { recipe: mergedRecipe, conflicts } = mergeRecipes(baseRecipe, targetRecipe, sourceRecipe);
    if (conflicts.length > 0) {
      throw new Error('存在冲突，需 PR 作者先解决冲突后才能合并');
    }
    const mergeId = this.remote._id();
    this.remote.commits.set(mergeId, {
      id: mergeId,
      msg: `Merge PR #${pr.id}: ${pr.title}`,
      parents: [targetTip, sourceTip],
      recipe: mergedRecipe,
      author: pr.author
    });
    this.remote.branches.set(pr.target, mergeId);
    pr.status = 'merged';
    this.remote.branches.delete(pr.source);
    return { type: 'merge-commit', pr, mergeId };
  }

  getOpenPRs() {
    return this.pullRequests.filter(p => p.status === 'open');
  }

  getAllPRs() {
    return [...this.pullRequests].reverse();
  }

  _copyRepo(src, dst) {
    dst.commits = new Map();
    for (const [id, c] of src.commits) {
      dst.commits.set(id, { ...c, recipe: c.recipe ? [...c.recipe] : [] });
    }
    dst.branches = new Map(src.branches);
    dst.counter = src.counter;
    dst.branchColors = new Map(src.branchColors);
    dst.colorIdx = src.colorIdx;
  }

  push(repo) {
    repo = repo || this.local;
    const branch = repo.currentBranch();
    if (!branch) throw new Error('HEAD 未指向分支');
    const tip = repo.branches.get(branch);
    const rtip = this.remote.branches.get(branch);
    const news = repo.getNewCommits(branch, this.remote);
    if (!news.length && tip === rtip) throw new Error('已是最新');
    if (rtip && !repo._isAnc(rtip, tip)) throw new Error('远端有新提交，请先同步拉取');
    for (const c of news) this.remote.commits.set(c.id, { ...c, recipe: c.recipe ? [...c.recipe] : undefined });
    if (!this.remote.branches.has(branch)) this.remote.branchColors.set(branch, repo.branchColors.get(branch));
    this.remote.branches.set(branch, tip);
    this.remote.counter = Math.max(this.remote.counter, repo.counter);
    // Keep remoteRefs in sync after successful push
    repo.remoteRefs.set('origin/' + branch, tip);
  }

  fetch(repo) {
    repo = repo || this.local;
    let n = 0;
    for (const [id, c] of this.remote.commits) {
      if (!repo.commits.has(id)) { repo.commits.set(id, { ...c, recipe: c.recipe ? [...c.recipe] : undefined }); n++; }
    }
    for (const [b, bid] of this.remote.branches) {
      repo.remoteRefs.set('origin/' + b, bid);
      if (!repo.branchColors.has(b)) repo.branchColors.set(b, this.remote.branchColors.get(b));
      // 简化模型：远端有新分支而本地没有时，自动创建本地追踪分支
      if (!repo.branches.has(b)) {
        repo.branches.set(b, bid);
      }
    }
    // 清理已被远端删除的分支（模拟 fetch --prune）
    const toDelete = [];
    for (const [refName] of repo.remoteRefs) {
      const branchName = refName.replace('origin/', '');
      if (!this.remote.branches.has(branchName)) {
        toDelete.push({ refName, branchName });
      }
    }
    // 如果当前所在分支已被远端删除（如 PR 合并后源分支被删），自动切回 main
    const curBranch = repo.currentBranch();
    if (curBranch && toDelete.some(d => d.branchName === curBranch) && repo.branches.has('main')) {
      repo.checkout('main');
    }
    for (const { refName, branchName } of toDelete) {
      repo.remoteRefs.delete(refName);
      if (repo.branches.has(branchName) && repo.currentBranch() !== branchName) {
        repo.branches.delete(branchName);
      }
    }
    repo.counter = Math.max(repo.counter, this.remote.counter);
    return n;
  }

  pull(repo, author) {
    repo = repo || this.local;
    this.fetch(repo);
    const branch = repo.currentBranch();
    if (!branch) throw new Error('HEAD 未指向分支');
    const rid = repo.remoteRefs.get('origin/' + branch);
    if (!rid) throw new Error('没有对应远端分支');
    const lid = repo.branches.get(branch);
    if (lid === rid || repo._isAnc(rid, lid)) return { type: 'up-to-date' };
    if (repo._isAnc(lid, rid)) {
      repo.branches.set(branch, rid);
      return { type: 'fast-forward', id: rid };
    }

    const baseId = findMergeBase(repo, lid, rid);
    const baseCommit = repo.commits.get(baseId);
    const localCommit = repo.commits.get(lid);
    const remoteCommit = repo.commits.get(rid);
    const baseRecipe = baseCommit ? baseCommit.recipe : [];
    const localRecipe = localCommit ? localCommit.recipe : [];
    const remoteRecipe = remoteCommit ? remoteCommit.recipe : [];
    const { recipe: mergedRecipe, conflicts } = mergeRecipes(baseRecipe, localRecipe, remoteRecipe);

    if (conflicts.length === 0) {
      const id = repo._id();
      repo.commits.set(id, { id, msg: '合并', parents: [lid, rid], recipe: mergedRecipe, author: author || '小蓝' });
      repo.branches.set(branch, id);
      repo.remoteRefs.set('origin/' + branch, rid);
      return { type: 'auto-merge', id };
    }

    return { type: 'conflict', localId: lid, remoteId: rid, baseRecipe, localRecipe, remoteRecipe, mergedRecipe, conflicts };
  }

  resolveConflict(repo, strategy, conflictInfo, author) {
    repo = repo || this.local;
    const branch = repo.currentBranch();
    const lid = repo.branches.get(branch);
    const rid = repo.remoteRefs.get('origin/' + branch);
    const id = repo._id();
    let msg, recipe;

    const localRecipe = conflictInfo ? conflictInfo.localRecipe : [];
    const remoteRecipe = conflictInfo ? conflictInfo.remoteRecipe : [];
    const conflicts = conflictInfo ? conflictInfo.conflicts : [];

    if (strategy === 'mine') {
      msg = '合并(保留我的)';
      recipe = [...localRecipe];
    } else if (strategy === 'theirs') {
      msg = '合并(保留对方)';
      recipe = [...remoteRecipe];
    } else {
      msg = '合并';
      recipe = [...(conflictInfo ? conflictInfo.mergedRecipe : localRecipe)];
      // 从后往前处理，避免 splice 导致索引偏移
      const sorted = [...conflicts].sort((a, b) => b.index - a.index);
      for (const c of sorted) {
        const both = [];
        if (c.ours !== undefined) both.push(c.ours);
        if (c.theirs !== undefined && c.theirs !== c.ours) both.push(c.theirs);
        recipe.splice(c.index, 1, ...both);
      }
    }

    repo.commits.set(id, { id, msg, parents: [lid, rid], recipe, author: author || '小蓝' });
    repo.branches.set(branch, id);
    // Update remoteRefs to reflect that remote tip has been integrated
    if (rid) {
      repo.remoteRefs.set('origin/' + branch, rid);
    }
    return id;
  }

  getAhead(repo) {
    repo = repo || this.local;
    const branch = repo.currentBranch();
    if (!branch) return 0;
    const localTip = repo.branches.get(branch);
    const remoteTip = repo.remoteRefs.get('origin/' + branch);
    if (!localTip || !remoteTip) return localTip ? 1 : 0;
    if (localTip === remoteTip) return 0;
    if (repo._isAnc(localTip, remoteTip)) return 0;
    // Count commits reachable from localTip but NOT from remoteTip
    const vis = new Set(), q = [remoteTip];
    while (q.length) {
      const id = q.shift();
      if (!id || vis.has(id)) continue;
      vis.add(id);
      const c = repo.commits.get(id) || this.remote.commits.get(id);
      if (c) q.push(...c.parents);
    }
    // BFS from local tip, skip nodes reachable from remote
    const localVis = new Set(), lq = [localTip];
    let count = 0;
    while (lq.length) {
      const id = lq.shift();
      if (!id || localVis.has(id) || vis.has(id)) continue;
      localVis.add(id);
      count++;
      const c = repo.commits.get(id);
      if (c) lq.push(...c.parents);
    }
    // Subtract 1 if the tip is a merge commit (a merge commit itself shouldn't count
    // as "ahead work"; it represents integration, not new local changes to push)
    // BUT: if there's only the merge commit + we counted it as 1, keep as 1 so
    // the UI still shows ↑1 to indicate there's a merge commit to push
    return count;
  }

  getBehind(repo) {
    repo = repo || this.local;
    const branch = repo.currentBranch();
    if (!branch) return 0;
    const localTip = repo.branches.get(branch);
    const remoteTip = repo.remoteRefs.get('origin/' + branch);
    if (!remoteTip || !localTip) return remoteTip ? 1 : 0;
    if (localTip === remoteTip) return 0;
    if (repo._isAnc(remoteTip, localTip)) return 0;
    const vis = new Set(), q = [localTip];
    while (q.length) {
      const id = q.shift();
      if (!id || vis.has(id)) continue;
      vis.add(id);
      const c = repo.commits.get(id) || this.remote.commits.get(id);
      if (c) q.push(...c.parents);
    }
    const remoteVis = new Set(), rq = [remoteTip];
    let count = 0;
    while (rq.length) {
      const id = rq.shift();
      if (!id || remoteVis.has(id) || vis.has(id)) continue;
      remoteVis.add(id);
      count++;
      const c = this.remote.commits.get(id) || repo.commits.get(id);
      if (c) rq.push(...c.parents);
    }
    return count;
  }
}

// ================================================================
// UNIFIED SVG RENDERER
// ================================================================
class UnifiedRenderer {
  constructor(svg) {
    this.svg = svg;
    this.R = 6;
    this.xGap = 26;
    this.yGap = 36;
    this.pad = { t: 30, l: 30, r: 360, b: 30 };
    this.nodeData = [];
    this._textX = this.pad.l + this.xGap;
  }

  _commitColor(author) {
    if (author === '小蓝') return '#2563eb';
    if (author === '小红') return '#dc2626';
    return '#64748b';
  }

  _textWidth(str, fontSize) {
    let w = 0;
    for (const ch of str) {
      w += ch.charCodeAt(0) > 127 ? fontSize : fontSize * 0.6;
    }
    return w;
  }

  _requiredWidth(nodes, localRepo, remoteRepo, reachable) {
    let maxRightEdge = 0;
    const headId = localRepo.headCommit();
    for (const n of nodes) {
      if (!reachable.has(n.id)) continue;
      const msgW = this._textWidth(n.msg, 11) + 6;
      let ox = msgW + 6;
      for (const b of n.brLabels) ox += this._textWidth(b, 8) + 12 + 4;
      for (const r of n.remoteLabels) ox += this._textWidth(r, 8) + 12 + 4;
      if (n.id === headId) ox += this._textWidth('HEAD', 8) + 12 + 4;
      if (publishState.production === n.id) ox += this._textWidth('线上', 8) + 12 + 4;
      if (publishState.canary === n.id) ox += this._textWidth('试吃', 8) + 12 + 4;
      if (n.recipe && n.recipe.includes(BAD_INGREDIENT)) ox += this._textWidth('AI 幻觉', 8) + 12 + 4;
      maxRightEdge = Math.max(maxRightEdge, this._textX + ox);
    }
    return maxRightEdge;
  }

  render(localRepo, remoteRepo) {
    const allCommits = new Map();
    for (const [id, c] of localRepo.commits) {
      allCommits.set(id, { ...c, recipe: c.recipe ? [...c.recipe] : undefined });
    }
    for (const [id, c] of remoteRepo.commits) {
      if (!allCommits.has(id)) {
        allCommits.set(id, { ...c, recipe: c.recipe ? [...c.recipe] : undefined });
      }
    }

    const localSet = new Set(localRepo.commits.keys());
    const remoteSet = new Set(remoteRepo.commits.keys());
    const reachable = this._reachableFrom(allCommits, localRepo, remoteRepo);
    const { nodes, maxLane, maxLevel } = this._layout(allCommits, localRepo, remoteRepo, reachable);

    for (const n of nodes) {
      const inLocal = localSet.has(n.id);
      const inRemote = remoteSet.has(n.id);
      n.synced = inLocal && inRemote;
      n.localOnly = inLocal && !inRemote;
      n.remoteOnly = !inLocal && inRemote;
      n.isUnreachable = !reachable.has(n.id);
      n.color = this._commitColor(n.author);
      n.isInitial = n.parents.length === 0;
    }

    // Filter out the initial commit (no parents) - it's just noise for learners
    const visibleNodes = nodes.filter(n => !n.isInitial && !n.isUnreachable);
    // Shift all visible nodes up by one level (since we removed the root)
    if (visibleNodes.length && nodes.some(n => n.isInitial)) {
      for (const n of visibleNodes) {
        n.y -= this.yGap;
      }
    }

    // All messages start in one column right of the track area, so curves never cross text
    const maxVisX = visibleNodes.reduce((m, n) => Math.max(m, n.x), this.pad.l);
    this._textX = maxVisX + this.xGap;

    // Ensure SVG width accommodates all labels; container scrolls if narrower
    const requiredW = this._requiredWidth(nodes, localRepo, remoteRepo, reachable);
    const contentW = this.pad.l + Math.max(maxLane, 0) * this.xGap;
    const w = Math.max(contentW + this.pad.r, requiredW + 20);
    const hasInitial = [...allCommits.values()].some(c => c.parents.length === 0);
    const levelOffset = hasInitial ? 1 : 0;
    const h = this.pad.t + Math.max(maxLevel - levelOffset, 0) * this.yGap + this.pad.b;
    this.svg.setAttribute('width', w);
    this.svg.setAttribute('height', h);
    this.svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    this.svg.innerHTML = '';

    // Empty state: cloned but no user commits yet
    if (!visibleNodes.length) {
      this.svg.setAttribute('width', 460);
      this.svg.setAttribute('height', 120);
      this.svg.setAttribute('viewBox', '0 0 460 120');
      this.svg.innerHTML = '';
      // Use HTML overlay for consistent styling with clone-guide
      const container = this.svg.parentElement;
      let emptyGuide = container.querySelector('.empty-guide');
      if (!emptyGuide) {
        emptyGuide = document.createElement('div');
        emptyGuide.className = 'clone-guide empty-guide';
        emptyGuide.innerHTML = `<div class="guide-title">厨房已就位，还没有任何存档</div><div class="guide-desc">在左侧给汉堡加一层，然后点「存档 commit」留下第一个版本</div>`;
        container.appendChild(emptyGuide);
      }
      emptyGuide.style.display = 'flex';
      this.nodeData = [];
      this.allCommits = allCommits;
      return;
    } else {
      // Hide empty guide if it exists
      const container = this.svg.parentElement;
      const emptyGuide = container.querySelector('.empty-guide');
      if (emptyGuide) emptyGuide.style.display = 'none';
    }

    for (const n of visibleNodes) {
      for (const pid of n.parents) {
        const pn = visibleNodes.find(x => x.id === pid);
        if (pn) this._edge(pn, n);
      }
    }
    for (const n of visibleNodes) this._node(n, localRepo, allCommits);
    for (const n of visibleNodes) this._labels(n, localRepo, remoteRepo);

    this.nodeData = visibleNodes;
    this.allCommits = allCommits;
  }

  _reachableFrom(allCommits, localRepo, remoteRepo) {
    // Only show commits reachable from the CURRENT branch (like `git log`)
    // plus the corresponding remote tracking ref for sync visibility
    const vis = new Set();
    const q = [];
    const curBranch = localRepo.currentBranch();
    const headId = localRepo.headCommit();
    q.push(headId);
    // Also include remote tracking ref for current branch (origin/xxx)
    const remoteRef = localRepo.remoteRefs.get('origin/' + curBranch);
    if (remoteRef) q.push(remoteRef);
    while (q.length) {
      const id = q.shift();
      if (!id || vis.has(id)) continue;
      vis.add(id);
      const c = allCommits.get(id);
      if (c) q.push(...c.parents);
    }
    return vis;
  }

  _layout(allCommits, localRepo, remoteRepo, reachable) {
    const commits = [...allCommits.values()].filter(c => reachable.has(c.id));
    if (!commits.length) return { nodes: [], maxLane: 0, maxLevel: 0 };

    // --- Step 1: Build adjacency (children map) & compute levels (longest path from root) ---
    const children = new Map();
    for (const c of commits) {
      for (const p of c.parents) {
        if (!children.has(p)) children.set(p, []);
        children.get(p).push(c.id);
      }
    }
    const levels = new Map();
    const roots = commits.filter(c => c.parents.length === 0 || c.parents.every(p => !reachable.has(p)));
    const q = [];
    for (const r of roots) { levels.set(r.id, 0); q.push(r.id); }
    while (q.length) {
      const id = q.shift();
      for (const kid of (children.get(id) || [])) {
        const nl = levels.get(id) + 1;
        if (!levels.has(kid) || levels.get(kid) < nl) levels.set(kid, nl);
        const kc = allCommits.get(kid);
        if (kc && kc.parents.every(p => levels.has(p) || !reachable.has(p))) q.push(kid);
      }
    }

    // --- Step 2: Determine branch ordering (main always first) ---
    const branchOrder = [];
    for (const [name] of localRepo.branches) {
      if (!branchOrder.includes(name)) branchOrder.push(name);
    }
    for (const [name] of remoteRepo.branches) {
      if (!branchOrder.includes(name)) branchOrder.push(name);
    }
    const mainIdx = branchOrder.indexOf('main');
    if (mainIdx > 0) { branchOrder.splice(mainIdx, 1); branchOrder.unshift('main'); }

    // --- Step 3: Lane assignment via first-parent chain walk from each branch tip ---
    const commitLane = new Map();
    const branchLane = new Map();
    let nextLane = 0;

    for (const b of branchOrder) {
      const tipId = localRepo.branches.get(b) || remoteRepo.branches.get(b);
      if (!tipId) continue;
      const lane = nextLane++;
      branchLane.set(b, lane);
      let cId = tipId;
      while (cId && !commitLane.has(cId)) {
        commitLane.set(cId, lane);
        const cm = allCommits.get(cId);
        cId = cm && cm.parents.length ? cm.parents[0] : null;
      }
    }

    // --- Step 4: Handle diverged remote refs (local remoteRefs + remote branches) ---
    for (const [, refId] of localRepo.remoteRefs) {
      if (!refId || commitLane.has(refId)) continue;
      const lane = nextLane++;
      let cId = refId;
      while (cId && !commitLane.has(cId)) {
        commitLane.set(cId, lane);
        const cm = allCommits.get(cId);
        cId = cm && cm.parents.length ? cm.parents[0] : null;
      }
    }
    for (const [, bid] of remoteRepo.branches) {
      if (!bid || commitLane.has(bid)) continue;
      const lane = nextLane++;
      let cId = bid;
      while (cId && !commitLane.has(cId)) {
        commitLane.set(cId, lane);
        const cm = allCommits.get(cId);
        cId = cm && cm.parents.length ? cm.parents[0] : null;
      }
    }

    // --- Step 5: Handle orphaned commits from merged-then-deleted branches ---
    // Walk from merge commit's second (and subsequent) parents backward
    // Sort by level to process earlier merges first
    const sortedByLevel = commits.slice().sort((a, b) => (levels.get(a.id) || 0) - (levels.get(b.id) || 0));
    for (const c of sortedByLevel) {
      if (c.parents.length <= 1) continue;
      // For each non-first parent of a merge commit
      for (let i = 1; i < c.parents.length; i++) {
        let cId = c.parents[i];
        if (!cId || commitLane.has(cId)) continue;
        const lane = nextLane++;
        while (cId && !commitLane.has(cId)) {
          commitLane.set(cId, lane);
          const cm = allCommits.get(cId);
          cId = cm && cm.parents.length ? cm.parents[0] : null;
        }
      }
    }

    // --- Step 6: Final fallback — any still-unassigned commit gets its own lane ---
    for (const c of commits) {
      if (!commitLane.has(c.id)) {
        commitLane.set(c.id, nextLane++);
      }
    }

    // --- Step 7: Lane compaction — collapse unnecessary lane separations ---
    // A commit only needs a separate lane from its parent when there's ACTUAL divergence
    // (i.e., the parent has another child continuing on the parent's lane).
    // Without divergence, the commit can stay on the parent's lane (linear continuation).
    for (const c of sortedByLevel) {
      if (c.parents.length === 0) continue;
      const parentId = c.parents[0];
      if (!commitLane.has(parentId)) continue;
      const parentLane = commitLane.get(parentId);
      const myLane = commitLane.get(c.id);
      if (parentLane === myLane) continue;

      // Check: does parent have any other child already on the parent's lane?
      const parentKids = children.get(parentId) || [];
      const siblingsOnParentLane = parentKids.filter(kid => commitLane.get(kid) === parentLane);

      if (siblingsOnParentLane.length === 0) {
        // No divergence at fork point — collapse this chain to the parent's lane
        let walkId = c.id;
        const originalLane = myLane;
        while (walkId) {
          if (commitLane.get(walkId) !== originalLane) break;
          commitLane.set(walkId, parentLane);
          const walkKids = (children.get(walkId) || []);
          walkId = walkKids.find(k => commitLane.get(k) === originalLane) || null;
        }
      }
    }

    // --- Step 8: Build node objects ---
    // One commit per row (gitgraph/vscode-git-graph style): order by level, then lane.
    // Parents always get a smaller level than children, so topological order is preserved.
    const rowOf = new Map();
    commits.slice().sort((a, b) =>
      (levels.get(a.id) || 0) - (levels.get(b.id) || 0) ||
      (commitLane.get(a.id) || 0) - (commitLane.get(b.id) || 0)
    ).forEach((c, i) => rowOf.set(c.id, i));

    const headId = localRepo.headCommit();
    let maxLane = 0, maxLevel = 0;
    const nodes = commits.map(c => {
      const lane = commitLane.get(c.id) || 0;
      const row = rowOf.get(c.id) || 0;
      maxLane = Math.max(maxLane, lane);
      maxLevel = Math.max(maxLevel, row);

      const brLabels = [];
      for (const [bn, bid] of localRepo.branches) if (bid === c.id) brLabels.push(bn);

      const remoteLabels = [];
      for (const [rn, rid] of localRepo.remoteRefs) if (rid === c.id) remoteLabels.push(rn);

      return {
        id: c.id, msg: c.msg, parents: c.parents, recipe: c.recipe, author: c.author,
        hasBad: c.recipe && c.recipe.includes(BAD_INGREDIENT),
        x: this.pad.l + lane * this.xGap,
        y: this.pad.t + row * this.yGap,
        brLabels, remoteLabels,
        isHead: c.id === headId,
        isMerge: c.parents.length > 1,
        color: 'oklch(0.55 0.01 95)'
      };
    });
    return { nodes, maxLane, maxLevel };
  }

  _edge(p, c) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    let d;
    if (p.x === c.x) {
      // Same lane: straight vertical
      d = `M${p.x} ${p.y}L${c.x} ${c.y}`;
    } else if (c.y - p.y <= this.yGap + 0.5) {
      // Adjacent rows: symmetric S-curve, vertical tangent at both ends (gitgraph.js style)
      const midY = (p.y + c.y) / 2;
      d = `M${p.x} ${p.y}C${p.x} ${midY} ${c.x} ${midY} ${c.x} ${c.y}`;
    } else {
      // Multi-row span: vertical drop, then S-curve across the last row gap
      const bendY = c.y - this.yGap;
      const midY = (bendY + c.y) / 2;
      d = `M${p.x} ${p.y}L${p.x} ${bendY}C${p.x} ${midY} ${c.x} ${midY} ${c.x} ${c.y}`;
    }
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', c.isUnreachable ? 'oklch(0.85 0.005 95)' : c.color);
    path.setAttribute('stroke-width', '2');
    path.setAttribute('opacity', c.isUnreachable ? '0.2' : '0.45');
    if (c.isUnreachable) path.setAttribute('stroke-dasharray', '4 3');
    this.svg.appendChild(path);
  }

  _node(n, localRepo, allCommits) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

    if (n.isUnreachable) {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y); circle.setAttribute('r', this.R - 1);
      circle.setAttribute('fill', 'oklch(0.95 0.005 95)'); circle.setAttribute('stroke', 'oklch(0.82 0.005 95)'); circle.setAttribute('stroke-width', '1.5');
      circle.setAttribute('stroke-dasharray', '2 2');
      g.appendChild(circle);
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', this._textX); t.setAttribute('y', n.y);
      t.setAttribute('text-anchor', 'start');
      t.setAttribute('dy', '0.35em'); t.setAttribute('fill', 'oklch(0.70 0.008 95)');
      t.setAttribute('font-size', '11'); t.setAttribute('font-weight', '400');
      t.setAttribute('font-family', '-apple-system, sans-serif');
      t.textContent = n.msg;
      g.appendChild(t);
      this.svg.appendChild(g);
      return;
    }

    // HEAD outer ring - larger and more visible
    if (n.isHead) {
      const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      ring.setAttribute('cx', n.x); ring.setAttribute('cy', n.y); ring.setAttribute('r', this.R + 4);
      ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', n.color); ring.setAttribute('stroke-width', '2');
      ring.setAttribute('opacity', '0.7');
      g.appendChild(ring);
    }

    // Node circle
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y); circle.setAttribute('r', this.R);

    if (n.synced) {
      // Synced: solid fill
      circle.setAttribute('fill', n.color);
      circle.setAttribute('stroke', n.color);
      circle.setAttribute('stroke-width', '2');
    } else {
      // Unsynced (local-only or remote-only): hollow with solid thick border
      circle.setAttribute('fill', '#fff');
      circle.setAttribute('stroke', n.color);
      circle.setAttribute('stroke-width', '2.5');
    }
    g.appendChild(circle);

    // Merge indicator - concentric ring inside
    if (n.isMerge) {
      const mc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      mc.setAttribute('cx', n.x); mc.setAttribute('cy', n.y); mc.setAttribute('r', this.R - 3);
      mc.setAttribute('fill', n.synced ? '#fff' : n.color);
      mc.setAttribute('stroke', 'none');
      g.appendChild(mc);
    }

    // Commit message text, aligned in one column right of all lanes
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', this._textX); t.setAttribute('y', n.y);
    t.setAttribute('text-anchor', 'start');
    t.setAttribute('dy', '0.35em');
    t.setAttribute('fill', 'oklch(0.27 0.012 95)');
    t.setAttribute('font-size', '11.5'); t.setAttribute('font-weight', '500');
    t.setAttribute('font-family', '-apple-system, sans-serif');
    t.textContent = n.msg;
    g.appendChild(t);

    // Hit area for hover
    const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    hitArea.setAttribute('cx', n.x); hitArea.setAttribute('cy', n.y);
    hitArea.setAttribute('r', this.R + 7);
    hitArea.setAttribute('fill', 'transparent');
    hitArea.setAttribute('stroke', 'none');
    hitArea.style.pointerEvents = 'all';
    hitArea.style.cursor = 'pointer';
    hitArea.dataset.commitId = n.id;
    g.appendChild(hitArea);

    this.svg.appendChild(g);
  }

  _labels(n, localRepo, remoteRepo) {
    if (n.isUnreachable) return;
    // Labels follow the message in the shared text column
    const msgWidth = this._textWidth(n.msg, 11) + 6;
    let ax = this._textX + msgWidth + 6;
    const labels = [];

    for (const b of n.brLabels) {
      labels.push({ t: b, c: localRepo.branchColors.get(b) || 'oklch(0.55 0.01 95)', cur: localRepo.currentBranch() === b, remote: false });
    }

    const seenRemote = new Set();
    for (const r of n.remoteLabels) {
      if (!seenRemote.has(r)) {
        seenRemote.add(r);
        labels.push({ t: r, c: 'oklch(0.55 0.01 95)', cur: false, remote: true });
      }
    }

    if (n.isHead) labels.push({ t: 'HEAD', c: '#dc2626', cur: true, remote: false });

    // 发布状态标签
    if (publishState.production === n.id) {
      labels.push({ t: '线上', c: '#16a34a', cur: true, remote: false });
    }
    if (publishState.canary === n.id) {
      labels.push({ t: '试吃', c: '#d97706', cur: true, remote: false });
    }

    // AI 幻觉食材警告标签
    if (n.hasBad) {
      labels.push({ t: 'AI 幻觉', c: '#b91c1c', cur: true, remote: false });
    }

    for (const lb of labels) {
      const tw = this._textWidth(lb.t, 8) + 12;
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', ax); rect.setAttribute('y', n.y - 7);
      rect.setAttribute('width', tw); rect.setAttribute('height', 14);
      rect.setAttribute('rx', '3');

      if (lb.remote) {
        rect.setAttribute('fill', 'oklch(0.96 0.004 95)');
        rect.setAttribute('stroke', 'oklch(0.70 0.008 95)');
        rect.setAttribute('stroke-width', '1');
        rect.setAttribute('stroke-dasharray', '3 2');
      } else {
        rect.setAttribute('fill', lb.c);
        rect.setAttribute('opacity', lb.cur ? '1' : '0.6');
      }
      this.svg.appendChild(rect);

      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', ax + tw / 2); t.setAttribute('y', n.y);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('dy', '0.32em');
      t.setAttribute('fill', lb.remote ? 'oklch(0.42 0.01 95)' : '#fff');
      t.setAttribute('font-size', '8'); t.setAttribute('font-weight', '600');
      t.setAttribute('font-family', '-apple-system, sans-serif');
      t.textContent = lb.t;
      this.svg.appendChild(t);
      ax += tw + 4;
    }
  }
}

// ================================================================
// APP STATE
// ================================================================
const sys = new GitSystem();
const renderer = new UnifiedRenderer(document.getElementById('graphSvg'));
let pendingConflictInfo = null;

// 发布状态：模拟线上环境
const publishState = {
  production: null,   // 全量线上版本对应的 commitId
  canary: null,       // 试吃（小流量）版本对应的 commitId
};

// Remote repo already exists (someone created it on GitHub with a README)
sys.remote.init();

// Both chefs start un-cloned — user must click "克隆仓库" to proceed
let currentChef = 'green'; // 'green' or 'red'

const chefState = {
  green: { initialized: false, workingRecipe: [] },
  red: { initialized: false, workingRecipe: [] }
};
function getChef() {
  const s = chefState[currentChef];
  return {
    repo: currentChef === 'green' ? sys.local : sys.teammate,
    get initialized() { return s.initialized; },
    set initialized(v) { s.initialized = v; },
    get workingRecipe() { return s.workingRecipe; },
    set workingRecipe(v) { s.workingRecipe = v; },
    author: currentChef === 'green' ? '小蓝' : '小红'
  };
}

function getCommittedRecipe() {
  if (!getChef().initialized) return [];
  return getChef().repo.getHeadRecipe();
}

function resetWorkingRecipe() {
  getChef().workingRecipe = getCommittedRecipe();
}

function switchChef(chef) {
  if (chef === currentChef) return;
  currentChef = chef;
  const avatar = document.getElementById('chefAvatar');
  // Swap image instantly
  if (chef === 'green') {
    avatar.src = 'img/chef1.webp';
    avatar.alt = '小蓝';
    avatar.className = 'chef-avatar active';
  } else {
    avatar.src = 'img/chef2.webp';
    avatar.alt = '小红';
    avatar.className = 'chef-avatar active-red';
  }
  // Trigger pop animation (avatar stays full width throughout)
  requestAnimationFrame(() => {
    avatar.classList.add('pop');
    avatar.addEventListener('animationend', () => {
      avatar.classList.remove('pop');
    }, { once: true });
  });
  // 切换视角时自动 fetch：模拟「这位厨师回到厨房看看远端有什么新内容」
  if (getChef().initialized) {
    const branchBefore = getChef().repo.currentBranch();
    sys.fetch(getChef().repo);
    // 如果 fetch 因远端分支被删除而自动切到了 main，重置工作区
    if (getChef().repo.currentBranch() !== branchBefore) {
      resetWorkingRecipe();
    }
  }
  render();
  if (chef === 'red') unlockAchievement('switch_red');
}

function toggleChef() {
  switchChef(currentChef === 'green' ? 'red' : 'green');
}

// ================================================================
// RENDER
// ================================================================
function render() {
  const graphContent = document.getElementById('graphContent');
  if (getChef().initialized) {
    // Show SVG graph, hide clone guide
    graphContent.innerHTML = '<svg id="graphSvg"></svg><div class="hover-card" id="hoverCard"><div class="hc-header" id="hcHeader"><img class="hc-avatar" id="hcAvatar" src="" alt=""><div class="hc-title-block"><div class="hc-msg" id="hcMsg"></div><div class="hc-meta" id="hcMeta"></div></div></div><div class="hc-sandwich" id="hcSandwich"></div><div class="hc-diff-label" id="hcDiffLabel"></div></div>';
    renderer.svg = document.getElementById('graphSvg');
    renderer.render(getChef().repo, sys.remote);
  } else {
    // Before clone: show guide in right panel center
    graphContent.innerHTML = `
      <div class="clone-guide">
        <div class="guide-title">远端仓库已建好</div>
        <div class="guide-desc">点击「<span class="sketch-underline-yellow">克隆仓库</span>」把项目拉到本地开始工作</div>
        <button class="btn" onclick="doClone()">克隆仓库 clone</button>
      </div>`;
  }
  renderChips();
  renderLeftPanel();
  setupHoverEvents();
  updateSyncLabel();
  updatePRBadge();
}

function renderChips() {
  const el = document.getElementById('branchChips');
  const section = document.getElementById('branchSection');
  const repo = getChef().repo;
  const cur = repo.currentBranch();
  el.innerHTML = '';
  if (!getChef().initialized) { section.style.display = 'none'; return; }
  // Show branch switcher only when there are multiple branches
  if (repo.branches.size > 1) {
    section.style.display = '';
  } else {
    section.style.display = 'none';
  }
  for (const [name] of repo.branches) {
    const chip = document.createElement('span');
    const isCurrent = name === cur;
    chip.className = 'branch-chip' + (isCurrent ? ' current' : '');
    if (isCurrent) {
      chip.style.background = repo.branchColors.get(name) || '#2563eb';
    }
    chip.textContent = name;
    chip.onclick = () => {
      if (name === repo.currentBranch()) return;
      const oldHeadRecipe = repo.getHeadRecipe();
      const isClean = JSON.stringify(getChef().workingRecipe) === JSON.stringify(oldHeadRecipe);
      if (!isClean) {
        // 有未存档修改：弹出选择对话框
        showSwitchBranchDirtyDialog(name);
        return;
      }
      try {
        repo.checkout(name);
        resetWorkingRecipe();
        render();
        toast(`checkout → ${name}`);
      } catch(e) { toast(e.message, true); }
    };
    el.appendChild(chip);
  }
}

function renderLeftPanel() {
  const repo = getChef().repo;

  if (!getChef().initialized) {
    renderSandwichView();
    document.getElementById('diffSummary').innerHTML = '';
    document.getElementById('diffSummary').style.background = 'transparent';
    return;
  }

  const hc = repo.commits.get(repo.headCommit());

  // Hamburger view
  renderSandwichView();

  // Diff summary
  renderDiffSummary();
}

function getRecipeById(cid) {
  const c = sys.remote.commits.get(cid) || getChef().repo.commits.get(cid);
  return c ? c.recipe : null;
}

function renderSandwichView() {
  const el = document.getElementById('sandwichView');
  el.innerHTML = '';
  const recipe = getChef().workingRecipe;

  // Top bun
  const topBread = document.createElement('div');
  topBread.className = 'sandwich-bread';
  topBread.style.zIndex = recipe.length + 2;
  topBread.innerHTML = '<img class="sprite-img" src="img/bun-top.webp" alt="顶面包">';
  el.appendChild(topBread);

  // Middle layers
  for (let i = 0; i < recipe.length; i++) {
    const layer = document.createElement('div');
    layer.className = 'sandwich-layer' + (recipe[i] === BAD_INGREDIENT ? ' bad' : '');
    layer.title = getIngredientName(recipe[i]);
    layer.style.zIndex = recipe.length - i + 1;
    if (recipe[i] === 'tomato') layer.style.transform = 'scale(1.25)';
    const imgSrc = getIngredientImg(recipe[i]);
    layer.innerHTML = `
      <img class="sprite-img" src="${imgSrc}" alt="${getIngredientName(recipe[i])}">
      <div class="layer-actions">
        <span class="layer-btn" onclick="showAIModifySelector(${i}, event)" title="让 AI 改这层"><img src="img/swap.svg" alt="swap"></span>
        <span class="layer-btn delete" onclick="removeLayer(${i})" title="删除"><img src="img/delete.svg" alt="delete"></span>
      </div>
    `;
    el.appendChild(layer);
  }

  // Add layer button
  const addBtn = document.createElement('div');
  addBtn.className = 'add-layer-btn';
  addBtn.innerHTML = '<img src="img/plus.svg" alt="+">';
  addBtn.title = '让 AI 加一层';
  addBtn.onclick = (e) => showAIAddSelector(e);
  el.appendChild(addBtn);

  // Bottom bun
  const bottomBread = document.createElement('div');
  bottomBread.className = 'sandwich-bread';
  bottomBread.innerHTML = '<img class="sprite-img" src="img/bun-bottom.webp" alt="底面包">';
  el.appendChild(bottomBread);

  // Auto-scale to fit container
  requestAnimationFrame(() => {
    const container = el.parentElement;
    if (!container) return;
    const containerH = container.clientHeight;
    const contentH = el.scrollHeight;
    if (contentH > containerH && containerH > 0) {
      const scale = containerH / contentH;
      el.style.transform = `scale(${Math.max(scale, 0.4)})`;
    } else {
      el.style.transform = '';
    }
  });

  // GSAP hover animations
  initSandwichHoverEffects();
}

function initSandwichHoverEffects() {
  const panel = document.getElementById('leftPanel');
  const sandwichView = document.getElementById('sandwichView');
  const addBtn = sandwichView ? sandwichView.querySelector('.add-layer-btn') : null;
  const layers = sandwichView ? sandwichView.querySelectorAll('.sandwich-layer') : [];

  if (!panel || !addBtn) return;

  // Clean up previous hover listeners
  if (panel._gsapCleanup) panel._gsapCleanup();

  let addBtnTween = null;

  const onPanelEnter = () => {
    if (addBtnTween) addBtnTween.kill();
    addBtnTween = gsap.to(addBtn, {
      opacity: 1,
      scale: 1,
      duration: 0.4,
      ease: 'back.out(1.7)'
    });
  };

  const onPanelLeave = () => {
    if (addBtnTween) addBtnTween.kill();
    addBtnTween = gsap.to(addBtn, {
      opacity: 0,
      scale: 0.6,
      duration: 0.25,
      ease: 'power2.in'
    });
  };

  panel.addEventListener('mouseenter', onPanelEnter);
  panel.addEventListener('mouseleave', onPanelLeave);

  // Layer hover: expand spacing with spring-like feel
  layers.forEach((layer) => {
    const onLayerEnter = () => {
      gsap.to(layer, {
        paddingTop: 10,
        paddingBottom: 10,
        duration: 0.35,
        ease: 'back.out(2)',
        overwrite: 'auto'
      });
    };

    const onLayerLeave = () => {
      gsap.to(layer, {
        paddingTop: 0,
        paddingBottom: 0,
        duration: 0.3,
        ease: 'power2.out',
        overwrite: 'auto'
      });
    };

    layer.addEventListener('mouseenter', onLayerEnter);
    layer.addEventListener('mouseleave', onLayerLeave);
  });

  // Cleanup reference
  panel._gsapCleanup = () => {
    panel.removeEventListener('mouseenter', onPanelEnter);
    panel.removeEventListener('mouseleave', onPanelLeave);
  };
}

function renderDiffSummary() {
  const el = document.getElementById('diffSummary');
  const committed = getCommittedRecipe();
  const recipe = getChef().workingRecipe;
  const diff = diffRecipes(committed, recipe);
  const changes = diff.filter(d => d.type !== 'same');
  if (changes.length === 0) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  } else {
    el.style.display = '';
    let html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;"><strong>未存档的修改：</strong><button class="discard-btn" onclick="discardAllChanges()">丢弃修改</button></div>';
    for (const d of changes) {
      const imgTag = `<span style="display:inline-flex;align-items:center;justify-content:center;width:52px;text-align:center;vertical-align:middle;margin:0 2px;"><img src="${getIngredientImg(d.value)}" style="width:48px;height:24px;object-fit:contain;"></span>`;
      if (d.type === 'added') {
        html += `<span class="added">+ 第${d.index + 1}层 新增 ${imgTag} ${getIngredientName(d.value)}</span><br>`;
      } else if (d.type === 'removed') {
        html += `<span class="removed">- 第${d.index + 1}层 删除 ${imgTag} ${getIngredientName(d.value)}</span><br>`;
      }
    }
    el.innerHTML = html;
    el.style.background = 'var(--amber-soft)';
  }
}

function discardAllChanges() {
  const committed = getCommittedRecipe();
  getChef().workingRecipe = [...committed];
  render();
  toast('已丢弃所有未存档的修改');
}

function commitAndSync() {
  const input = document.getElementById('syncCommitMsg');
  const msg = input ? input.value.trim() : '';
  closeDialog();
  // Do commit
  getChef().repo.commit('', msg, getChef().workingRecipe, getChef().author);
  resetWorkingRecipe();
  unlockAchievement('first_commit');
  if (currentChef === 'red') { _redCommitted = true; if (_redCommitted && _redPushed) unlockAchievement('team_collab'); }
  render();
  toast('已存档');
  // Then sync
  setTimeout(() => doSync(), 100);
}

// ================================================================
// INGREDIENT SELECTOR
// ================================================================
function showIngredientSelector(x, y, callback, excludeEmoji, anchorEl) {
  const sel = document.getElementById('ingredientSelector');
  sel.innerHTML = '';
  sel.classList.add('show');

  // Build options first so we can measure
  for (const ing of INGREDIENTS) {
    if (ing.id === excludeEmoji) continue;
    const opt = document.createElement('span');
    opt.className = 'ing-option';
    opt.innerHTML = `<img class="sprite-img" src="${ing.img}" style="width:32px;height:auto;max-height:20px;object-fit:contain"> ${ing.name}`;
    opt.onclick = () => {
      callback(ing.id);
      hideIngredientSelector();
    };
    sel.appendChild(opt);
  }

  // Position: right of anchor, vertically centered
  if (anchorEl) {
    const rect = anchorEl.getBoundingClientRect();
    const selRect = sel.getBoundingClientRect();
    sel.style.left = (rect.right + 10) + 'px';
    sel.style.top = (rect.top + rect.height / 2 - selRect.height / 2) + 'px';
  } else {
    sel.style.left = x + 'px';
    sel.style.top = y + 'px';
  }

  // Close on outside click
  setTimeout(() => {
    document.addEventListener('click', closeIngSelectorOnOutside, { once: true });
  }, 10);
}

function closeIngSelectorOnOutside(e) {
  const sel = document.getElementById('ingredientSelector');
  if (!sel.contains(e.target)) {
    hideIngredientSelector();
  }
}

function hideIngredientSelector() {
  document.getElementById('ingredientSelector').classList.remove('show');
}

// AI 翻车率（0-100）
let _failRate = 0;

function updateFailRate(val) {
  _failRate = parseInt(val);
  document.getElementById('failRateLabel').textContent = _failRate + '%';
}

function isFailMode() {
  return Math.random() * 100 < _failRate;
}

function showAIModifySelector(index, event) {
  event.stopPropagation();
  const anchorEl = event.currentTarget;
  const rect = anchorEl.getBoundingClientRect();
  const recipe = getChef().workingRecipe;
  const shouldFail = isFailMode();
  showIngredientSelector(rect.right + 4, rect.top, (emoji) => {
    recipe[index] = emoji;
    if (shouldFail && recipe.length > 1) {
      const otherIndices = [...Array(recipe.length).keys()].filter(i => i !== index);
      const victimIdx = otherIndices[Math.floor(Math.random() * otherIndices.length)];
      recipe[victimIdx] = BAD_INGREDIENT;
      renderLeftPanel();
      toast(`AI 改好了第${index + 1}层，但第${victimIdx + 1}层好像被改坏了…`, true);
      unlockAchievement('ai_fail');
    } else {
      renderLeftPanel();
      toast(`AI 把第${index + 1}层改成了 ${toastImg(emoji)} ${getIngredientName(emoji)}`);
    }
  }, recipe[index], anchorEl);
}

// AI 执行添加一层
function showAIAddSelector(event) {
  event.stopPropagation();
  if (!getChef().initialized) { toast('请先克隆仓库', true); return; }
  const anchorEl = event.currentTarget;
  const rect = anchorEl.getBoundingClientRect();
  const recipe = getChef().workingRecipe;
  const shouldFail = isFailMode();
  showIngredientSelector(rect.right + 4, rect.top, (emoji) => {
    recipe.push(emoji);
    if (shouldFail && recipe.length > 1) {
      const otherIndices = [...Array(recipe.length - 1).keys()];
      const victimIdx = otherIndices[Math.floor(Math.random() * otherIndices.length)];
      recipe[victimIdx] = BAD_INGREDIENT;
      renderLeftPanel();
      toast(`AI 加了 ${toastImg(emoji)}，但第${victimIdx + 1}层好像被改坏了…`, true);
      unlockAchievement('ai_fail');
    } else {
      renderLeftPanel();
      toast(`AI 加了 ${toastImg(emoji)} ${getIngredientName(emoji)}`);
    }
  }, undefined, anchorEl);
}

function removeLayer(index) {
  getChef().workingRecipe.splice(index, 1);
  renderLeftPanel();
}

// ================================================================
// HOVER INTERACTION
// ================================================================
const hoverCard = { get el() { return document.getElementById('hoverCard'); } };
let _lastHoverCommitId = null;

function setupHoverEvents() {
  const svg = document.getElementById('graphSvg');
  if (!svg) return;
  svg.onmousemove = handleSvgMouseMove;
  svg.onmouseleave = hideHoverCard;
}

function handleSvgMouseMove(e) {
  const target = e.target;
  let commitId = target.dataset && target.dataset.commitId;
  if (!commitId) {
    const parent = target.closest ? target.closest('g') : target.parentElement;
    if (parent) {
      const hitEl = parent.querySelector('[data-commit-id]');
      if (hitEl) commitId = hitEl.dataset.commitId;
    }
  }
  if (commitId) {
    showHoverCard(commitId, e);
  } else {
    hideHoverCard();
  }
}

function showHoverCard(commitId, e) {
  const nodeData = renderer.nodeData.find(n => n.id === commitId);
  if (!nodeData || nodeData.isUnreachable) { hideHoverCard(); return; }

  const card = hoverCard.el;
  if (!card) return;

  // Only rebuild content if commit changed (prevents PNG flicker)
  if (_lastHoverCommitId !== commitId) {
    _lastHoverCommitId = commitId;
    const allCommits = renderer.allCommits;
    const msgEl = document.getElementById('hcMsg');
    const metaEl = document.getElementById('hcMeta');
    const sandwichEl = document.getElementById('hcSandwich');
    const diffLabel = document.getElementById('hcDiffLabel');
    const avatarEl = document.getElementById('hcAvatar');

    msgEl.textContent = nodeData.msg;
    // Show meta: author + short hash
    const shortHash = commitId.slice(0, 7);
    metaEl.textContent = `${nodeData.author || ''}  ${shortHash}`;
    // Show committer avatar
    if (nodeData.author) {
      avatarEl.src = nodeData.author === '小红' ? 'img/chef2.webp' : 'img/chef1.webp';
      avatarEl.style.display = 'block';
    } else {
      avatarEl.style.display = 'none';
    }
    sandwichEl.innerHTML = '';

    let parentRecipe = null;
    if (nodeData.parents.length > 0) {
      const parentCommit = allCommits.get(nodeData.parents[0]);
      // If parent is the initial commit (hidden from user), treat as empty
      if (parentCommit && parentCommit.recipe) {
        parentRecipe = parentCommit.parents.length === 0 ? [] : parentCommit.recipe;
      }
    }

    if (nodeData.recipe) {
      let diff = parentRecipe ? diffRecipes(parentRecipe, nodeData.recipe) : null;
      if (diff) {
        for (const d of diff) {
          const layer = document.createElement('span');
          layer.className = 'hc-layer';
          let prefix = '';
          if (d.type === 'added') { layer.classList.add('diff-added'); prefix = '+ '; }
          else if (d.type === 'removed') { layer.classList.add('diff-removed'); prefix = '- '; }
          layer.innerHTML = `${prefix}<span style="display:inline-flex;align-items:center;justify-content:center;width:52px;vertical-align:middle;margin-right:3px;"><img src="${getIngredientImg(d.value)}" style="width:48px;height:24px;object-fit:contain;"></span>${getIngredientName(d.value)}`;
          sandwichEl.appendChild(layer);
        }
        const addCount = diff.filter(d => d.type === 'added').length;
        const delCount = diff.filter(d => d.type === 'removed').length;
        let statsHtml = '';
        const parts = [];
        if (addCount) parts.push(`<span class="legend-item legend-add">${addCount} 层插入(+)</span>`);
        if (delCount) parts.push(`<span class="legend-item legend-del">${delCount} 层删除(-)</span>`);
        statsHtml += parts.join(', ');
        diffLabel.innerHTML = statsHtml;
      } else {
        for (const ing of nodeData.recipe) {
          const layer = document.createElement('span');
          layer.className = 'hc-layer';
          layer.innerHTML = `<img src="${getIngredientImg(ing)}" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;margin-right:3px;">${getIngredientName(ing)}`;
          sandwichEl.appendChild(layer);
        }
        diffLabel.innerHTML = '';
      }
    } else {
      diffLabel.innerHTML = '';
    }
  }

  // Position using mouse coordinates relative to graphContent container
  const container = card.parentElement;
  if (!container) return;
  const rect = container.getBoundingClientRect();
  let cardX = e.clientX - rect.left + container.scrollLeft + 14;
  let cardY = e.clientY - rect.top + container.scrollTop - 14;

  // Prevent overflow
  const cardW = card.offsetWidth || 180;
  const cardH = card.offsetHeight || 100;
  if (cardX + cardW > container.scrollLeft + container.clientWidth) {
    cardX = e.clientX - rect.left + container.scrollLeft - cardW - 10;
  }
  if (cardY + cardH > container.scrollTop + container.clientHeight) {
    cardY = container.scrollTop + container.clientHeight - cardH - 4;
  }
  if (cardY < container.scrollTop) cardY = container.scrollTop + 4;

  card.style.left = cardX + 'px';
  card.style.top = cardY + 'px';
  card.classList.add('visible');
}

function hideHoverCard() {
  _lastHoverCommitId = null;
  const card = hoverCard.el;
  if (card) card.classList.remove('visible');
}

function requireInit() {
  if (!getChef().initialized) {
    toast('请先在右侧点击「克隆仓库 clone」拉取项目', true);
    return false;
  }
  return true;
}

function doCommit() {
  if (!requireInit()) return;
  const committed = getCommittedRecipe();
  const { added, removed, modified } = diffSummary(committed, getChef().workingRecipe);
  if (added === 0 && removed === 0 && modified === 0) {
    toast('工作区没有修改，无需存档', true);
    return;
  }
  const author = getChef().author;
  openDialog('存档 (commit)', '描述这次改了什么', val => {
    const id = getChef().repo.commit('', val, getChef().workingRecipe, author);
    resetWorkingRecipe();
    render();
    toast('已存档 → ' + getChef().repo.commits.get(id).msg);
    unlockAchievement('first_commit');
    if (currentChef === 'red') { _redCommitted = true; if (_redCommitted && _redPushed) unlockAchievement('team_collab'); }
  });
}

function showBranchDialog(andCheckout) {
  if (!requireInit()) return;
  const title = andCheckout ? '创建分支并切换 (checkout -b)' : '创建分支 (branch)';
  openDialog(title, 'feature-name', val => {
    try {
      getChef().repo.branch(val);
      if (andCheckout) getChef().repo.checkout(val);
      render();
      toast(andCheckout ? `checkout -b ${val}` : `branch ${val}`);
      unlockAchievement('first_branch');
    } catch(e) { toast(e.message, true); }
  }, {
    validate: val => {
      if (!val) return '请输入分支名';
      if (/\s/.test(val)) return '分支名不能包含空格';
      if (getChef().repo.branches.has(val)) return `分支 "${val}" 已存在`;
      return null;
    }
  });
}

function showSwitchBranchDirtyDialog(targetBranch) {

function discardAndSwitch(targetBranch) {
  const repo = getChef().repo;
  try {
    repo.checkout(targetBranch);
    resetWorkingRecipe();
    closeDialog();
    render();
    toast(`已丢弃修改，checkout → ${targetBranch}`);
  } catch(e) { toast(e.message, true); }
}

function commitAndSwitch(targetBranch) {
  const repo = getChef().repo;
  const input = document.getElementById('switchCommitMsg');
  const errEl = document.getElementById('switchDlgError');
  const msg = input ? input.value.trim() : '';
  if (!msg) {
    if (errEl) { errEl.textContent = '请输入存档信息'; errEl.style.display = 'block'; }
    return;
  }
  try {
    const author = getChef().author;
    repo.commit('', msg, getChef().workingRecipe, author);
    resetWorkingRecipe();
    repo.checkout(targetBranch);
    resetWorkingRecipe();
    closeDialog();
    render();
    toast(`已存档，checkout → ${targetBranch}`);
    unlockAchievement('first_commit');
  } catch(e) { toast(e.message, true); }
}

function getMsgById(cid) {
  const c = sys.remote.commits.get(cid) || getChef().repo.commits.get(cid);
  return c ? c.msg : cid;
}

function renderRecipeThumb(recipe) {
  if (!recipe || recipe.length === 0) return '<span class="empty-text">空</span>';
  const total = recipe.length;
  let html = '<div class="mini-burger">';
  html += `<img class="mini-bread top" src="img/bun-top.webp" alt="顶面包" style="z-index:${total + 2}">`;
  for (let i = 0; i < total; i++) {
    const z = total - i + 1;
    html += `<div class="mini-layer" style="z-index:${z}"><img src="${getIngredientImg(recipe[i])}" alt="${getIngredientName(recipe[i])}"></div>`;
  }
  html += `<img class="mini-bread" src="img/bun-bottom.webp" alt="底面包" style="z-index:1">`;
  html += '</div>';
  return html;
}

function renderRecipeInline(recipe) {
  if (!recipe || recipe.length === 0) return '';
  return recipe.map(ing => `<span style="display:inline-flex;align-items:center;justify-content:center;width:52px;vertical-align:middle;"><img src="${getIngredientImg(ing)}" alt="${getIngredientName(ing)}" style="width:48px;height:24px;object-fit:contain;"></span>`).join('');
}

function doPublish(type) {
  const remoteTip = sys.remote.branches.get('main');
  if (type === 'canary') {
    publishState.canary = remoteTip;
    closeDialog(); render();
    toast('试吃发布成功！只有部分顾客能尝到新菜');
    unlockAchievement('canary_pub');
    // Track bad canary for rollback_fix achievement
    const canaryRecipe = getRecipeById(publishState.canary);
    if (canaryRecipe && isBadRecipe(canaryRecipe)) {
      _hadBadProduction = true;
    }
  } else if (type === 'full') {
    publishState.production = publishState.canary || remoteTip;
    publishState.canary = null;
    closeDialog(); render();
    toast('全店发布成功！所有顾客都能点到新菜了');
    unlockAchievement('full_pub');
    // Track bad production for rollback_fix achievement
    const prodRecipe = getRecipeById(publishState.production);
    if (prodRecipe && isBadRecipe(prodRecipe)) {
      _hadBadProduction = true;
    }
  } else if (type === 'rollback') {
    // Check if rolling back from a bad state
    if (_hadBadProduction) {
      unlockAchievement('rollback_fix');
      _hadBadProduction = false;
    }
    publishState.canary = null;
    closeDialog(); render();
    toast('已回滚，试吃版本已下线');
  }
}

function showMergeDialog() {
  const repo = getChef().repo; const cur = repo.currentBranch();
  if (!cur) { toast('HEAD 未指向分支', true); return; }

  // 检查工作区是否干净
  const headRecipe = repo.getHeadRecipe();
  const isClean = JSON.stringify(getChef().workingRecipe) === JSON.stringify(headRecipe);
  if (!isClean) {
    toast('请先存档或丢弃工作区的修改，再进行合并', true);
    return;
  }

  const others = [...repo.branches.keys()].filter(b => b !== cur);
  if (!others.length) { toast('没有其他分支可合并', true); return; }
  const ov = document.getElementById('dialogOverlay'), dl = document.getElementById('dialog');
  dl.innerHTML = `<h3>将 ${cur} 合入到…</h3><p style="color:var(--text-3);font-size:12px;margin:0 0 0.6rem">当前分支 <b>${cur}</b> 的改动将合入你选择的目标分支：</p><div style="display:flex;gap:0.3rem;flex-wrap:wrap;margin-bottom:0.8rem">${others.map(b => `<button class="btn" onclick="doMerge('${b}')" style="position:relative">${cur} → ${b}</button>`).join('')}</div><div class="dialog-btns"><button class="btn" onclick="closeDialog()">取消</button></div>`;
  ov.classList.add('show');
}

function doMerge(targetBranch) {
  const repo = getChef().repo;
  const sourceBranch = repo.currentBranch();
  try {
    // 切到目标分支，将源分支合入（与 git checkout target && git merge source 一致）
    repo.checkout(targetBranch);
    const result = repo.merge(sourceBranch, getChef().author);
    if (result.type === 'recipe-conflict') {
      closeDialog();
      render();
      showMergeRecipeConflictDialog(sourceBranch, result);
      return;
    }
    closeDialog();
    resetWorkingRecipe();
    render();
    toast(result.type === 'fast-forward' ? `合并成功（快进）：${sourceBranch} → ${targetBranch}` : `合并成功：${sourceBranch} → ${targetBranch}`);
    unlockAchievement('first_merge');
  } catch(e) {
    // 出错时切回原分支
    try { repo.checkout(sourceBranch); } catch(_) {}
    closeDialog();
    render();
    toast(e.message, true);
  }
}

function showMergeRecipeConflictDialog(sourceBranch, conflictResult) {
  const ov = document.getElementById('dialogOverlay'), dl = document.getElementById('dialog');
  const { curRecipe, targetRecipe, conflicts } = conflictResult;
  const repo = getChef().repo;
  const cur = repo.currentBranch();

  window._mergeConflictSource = sourceBranch;
  window._mergeConflictInfo = conflictResult;

  const conflictIndices = new Set(conflicts.map(c => c.index));

  let oursHtml = '';
  for (let i = 0; i < curRecipe.length; i++) {
    const cls = conflictIndices.has(i) ? ' conflict' : '';
    oursHtml += `<span class="preview-layer${cls}"><img src="${getIngredientImg(curRecipe[i])}">${getIngredientName(curRecipe[i])}</span>`;
  }

  let theirsHtml = '';
  for (let i = 0; i < targetRecipe.length; i++) {
    const cls = conflictIndices.has(i) ? ' conflict' : '';
    theirsHtml += `<span class="preview-layer${cls}"><img src="${getIngredientImg(targetRecipe[i])}">${getIngredientName(targetRecipe[i])}</span>`;
  }

  dl.innerHTML = `
    <h3>配方冲突!</h3>
    <p>合并 <b>${sourceBranch}</b> → <b>${cur}</b> 时，${conflicts.length} 层发生冲突（红框标出）：</p>
    <div class="recipe-compare">
      <div class="side">
        <div class="side-label">当前分支 (${cur})</div>
        <div class="sandwich-preview">${oursHtml}</div>
      </div>
      <div class="side">
        <div class="side-label">来源分支 (${sourceBranch})</div>
        <div class="sandwich-preview">${theirsHtml}</div>
      </div>
    </div>
    <div class="dialog-btns" style="flex-direction:column;align-items:stretch;">
      <button class="btn" onclick="resolveMergeRecipe('mine')">保留当前分支 (${cur})</button>
      <button class="btn" onclick="resolveMergeRecipe('theirs')">保留来源分支 (${sourceBranch})</button>
      <button class="btn active" onclick="resolveMergeRecipe('both')">合并两者</button>
    </div>`;
  ov.classList.add('show');
}

function resolveMergeRecipe(strategy) {
  const sourceBranch = window._mergeConflictSource;
  const info = window._mergeConflictInfo;
  const repo = getChef().repo;
  let recipe;
  if (strategy === 'mine') {
    recipe = [...info.curRecipe];
  } else if (strategy === 'theirs') {
    recipe = [...info.targetRecipe];
  } else {
    recipe = [...info.mergedRecipe];
    // 从后往前处理，避免 splice 导致索引偏移
    const sorted = [...info.conflicts].sort((a, b) => b.index - a.index);
    for (const c of sorted) {
      const both = [];
      if (c.ours !== undefined) both.push(c.ours);
      if (c.theirs !== undefined && c.theirs !== c.ours) both.push(c.theirs);
      recipe.splice(c.index, 1, ...both);
    }
  }
  repo.mergeWithRecipe(sourceBranch, recipe, getChef().author);
  resetWorkingRecipe();
  closeDialog();
  render();
  const labels = { mine: '保留当前分支', theirs: '保留来源分支', both: '合并两者' };
  toast(`配方冲突已解决: ${labels[strategy]}`);
  unlockAchievement('first_merge');
}
