        </div>
      </div>`;
    }
    listHtml += '</div>';
  }

  // 判断是否可以创建 PR（当前分支不是 main 且已推送）
  const repo = getChef().repo;
  const curBranch = repo.currentBranch();
  const canCreate = curBranch && curBranch !== 'main' && sys.remote.branches.has(curBranch);
  const createBtn = canCreate
    ? `<button class="btn dark" onclick="showCreatePRForm()">创建 PR (${curBranch} → main)</button>`
    : `<button class="btn" disabled style="opacity:0.5;cursor:not-allowed;" title="需要先在非 main 分支上 push">创建 PR</button>`;

  dl.innerHTML = `
    <h3>Pull Requests</h3>
    <p style="font-size:0.72rem;color:var(--text-3);margin-bottom:0.5rem;">PR = 请求队友审核后再合并到主分支，保障代码质量</p>
    ${listHtml}
    <div class="dialog-btns">
      <button class="btn" onclick="closeDialog()">关闭</button>
      ${createBtn}
    </div>`;
  ov.classList.add('show');
}

function showCreatePRForm() {
  const ov = document.getElementById('dialogOverlay'), dl = document.getElementById('dialog');
  const repo = getChef().repo;
  const curBranch = repo.currentBranch();
  const targets = [...sys.remote.branches.keys()].filter(b => b !== curBranch);
  const targetOptions = targets.map(b => `<option value="${b}"${b === 'main' ? ' selected' : ''}>${b}</option>`).join('');

  // 获取当前分支相对目标的差异提交
  const sourceTip = sys.remote.branches.get(curBranch);
  const targetTip = sys.remote.branches.get('main');
  let diffHtml = '';
  if (sourceTip && targetTip && sourceTip !== targetTip) {
    const sourceRecipe = sys.remote.commits.get(sourceTip)?.recipe || [];
    const targetRecipe = sys.remote.commits.get(targetTip)?.recipe || [];
    const diff = diffRecipes(targetRecipe, sourceRecipe);
    const changes = diff.filter(d => d.type !== 'same');
    if (changes.length > 0) {
      diffHtml = '<div style="background:var(--surface);border:0.5px solid var(--border);padding:8px;margin:8px 0;font-size:0.72rem;">';
      diffHtml += '<div style="font-weight:600;margin-bottom:4px;">变更预览：</div>';
      for (const d of changes) {
        const imgTag = `<img src="${getIngredientImg(d.value)}" style="width:28px;height:14px;object-fit:contain;vertical-align:middle;">`;
        if (d.type === 'added') diffHtml += `<div style="color:var(--green);">+ ${imgTag} ${getIngredientName(d.value)}</div>`;
        else if (d.type === 'removed') diffHtml += `<div style="color:var(--red);">- ${imgTag} ${getIngredientName(d.value)}</div>`;
      }
      diffHtml += '</div>';
    }
  }

  dl.innerHTML = `
    <h3>创建 Pull Request</h3>
    <div style="font-size:0.78rem;margin-bottom:0.5rem;">
      <span style="background:#282620;color:white;padding:2px 8px;font-weight:600;">${curBranch}</span>
      <span style="margin:0 6px;color:var(--text-3);">→</span>
      <select id="prTarget" style="padding:2px 8px;border:1px solid var(--border);font-size:0.78rem;">${targetOptions}</select>
    </div>
    ${diffHtml}
    <input id="prTitle" class="dialog-input" placeholder="PR 标题（可选，默认为分支名）" style="margin-bottom:0.6rem;" />
    <div class="dialog-btns">
      <button class="btn" onclick="showPRDialog()">返回</button>
      <button class="btn dark" onclick="doCreatePR()">提交 PR</button>
    </div>`;
  setTimeout(() => { const i = document.getElementById('prTitle'); if(i) { i.focus(); i.onkeydown = e => { if(e.key==='Enter') doCreatePR(); }; } }, 50);
}

function doCreatePR() {
  const repo = getChef().repo;
  const source = repo.currentBranch();
  const target = document.getElementById('prTarget').value;
  const title = document.getElementById('prTitle').value.trim() || undefined;
  try {
    const pr = sys.createPR(getChef().author, source, target, title);
    closeDialog();
    render();
    toast(`PR #${pr.id} 创建成功，等待队友审核`);
    unlockAchievement('first_pr');
  } catch(e) {
    toast(e.message, true);
  }
}

function showPRDetail(prId) {
  const pr = sys.pullRequests.find(p => p.id === prId);
  if (!pr) return;
  const ov = document.getElementById('dialogOverlay'), dl = document.getElementById('dialog');
  const myName = getChef().author;
  const isAuthor = pr.author === myName;

  // 差异预览 & 冲突检测
  const sourceTip = sys.remote.branches.get(pr.source);
  const targetTip = sys.remote.branches.get(pr.target);
  let diffHtml = '';
  let hasConflict = false;
  if (sourceTip && targetTip) {
    const sourceRecipe = sys.remote.commits.get(sourceTip)?.recipe || [];
    const targetRecipe = sys.remote.commits.get(targetTip)?.recipe || [];
    const diff = diffRecipes(targetRecipe, sourceRecipe);
    const changes = diff.filter(d => d.type !== 'same');
    if (changes.length > 0) {
      diffHtml = '<div style="background:var(--surface);border:0.5px solid var(--border);padding:8px;margin:8px 0;font-size:0.72rem;">';
      diffHtml += '<div style="font-weight:600;margin-bottom:4px;">变更内容：</div>';
      for (const d of changes) {
        const imgTag = `<img src="${getIngredientImg(d.value)}" style="width:28px;height:14px;object-fit:contain;vertical-align:middle;">`;
        if (d.type === 'added') diffHtml += `<div style="color:var(--green);">+ ${imgTag} ${getIngredientName(d.value)}</div>`;
        else if (d.type === 'removed') diffHtml += `<div style="color:var(--red);">- ${imgTag} ${getIngredientName(d.value)}</div>`;
      }
      diffHtml += '</div>';
    }
    // 冲突检测：三路合并判断是否有冲突
    if (!sys.remote._isAnc(sourceTip, targetTip) && !sys.remote._isAnc(targetTip, sourceTip)) {
      const baseId = findMergeBase(sys.remote, targetTip, sourceTip);
      const baseRecipe = sys.remote.commits.get(baseId)?.recipe || [];
      const { conflicts } = mergeRecipes(baseRecipe, targetRecipe, sourceRecipe);
      if (conflicts.length > 0) {
        hasConflict = true;
        diffHtml += `<div style="background:var(--red-soft);border:0.5px solid var(--red);padding:6px 8px;margin:4px 0;font-size:0.72rem;color:var(--red);font-weight:600;">存在 ${conflicts.length} 处冲突，无法自动合并</div>`;
      }
    }
  }

  // 审核状态
  let reviewHtml = '';
  if (pr.reviews.length > 0) {
    reviewHtml = '<div style="margin:8px 0;font-size:0.75rem;">';
    for (const r of pr.reviews) {
      const icon = r.status === 'approved' ? '<span style="color:#16a34a;font-weight:700;">Approved</span>' : '<span style="color:#dc2626;font-weight:700;">Changes Requested</span>';
      reviewHtml += `<div style="padding:4px 0;border-bottom:0.5px solid var(--border);">${r.reviewer}: ${icon}${r.comment ? ` — "${r.comment}"` : ''}</div>`;
    }
    reviewHtml += '</div>';
  } else {
    reviewHtml = '<div style="color:var(--text-3);font-size:0.75rem;padding:6px 0;">暂无审核</div>';
  }

  // 操作按钮
  const hasApproval = pr.reviews.some(r => r.status === 'approved');
  let actionHtml = '';
  if (!isAuthor && pr.status === 'open') {
    // 非作者可以审核
    actionHtml += `
      <button class="btn" style="border-color:#dc2626;color:#dc2626;" onclick="doReviewPR(${pr.id}, 'changes_requested')">Request Changes</button>
      <button class="btn dark" style="background:#16a34a;border-color:#16a34a;" onclick="doReviewPR(${pr.id}, 'approved')">Approve</button>`;
  }
  if (hasConflict) {
    // 冲突时禁用 Merge，作者可解决冲突
    if (isAuthor) {
      actionHtml += `<button class="btn dark" onclick="showConflictResolver(${pr.id})">解决冲突</button>`;
    } else {
      actionHtml += `<button class="btn" disabled style="opacity:0.4;cursor:not-allowed;">Merge（存在冲突）</button>`;
    }
  } else if (hasApproval) {
    // 无冲突且已审核通过，可以合并
    actionHtml += `<button class="btn dark" onclick="doMergePR(${pr.id})">Merge PR</button>`;
  }

  dl.innerHTML = `
    <h3>PR #${pr.id}: ${pr.title}</h3>
    <div style="font-size:0.75rem;color:var(--text-2);margin-bottom:0.3rem;">
      <span style="background:#282620;color:white;padding:1px 6px;font-size:0.7rem;">${pr.source}</span>
      <span style="margin:0 4px;">→</span>
      <span style="background:var(--surface);border:0.5px solid var(--border);padding:1px 6px;font-size:0.7rem;">${pr.target}</span>
      <span style="margin-left:8px;color:var(--text-3);">by ${pr.author}</span>
    </div>
    ${diffHtml}
    <div style="font-weight:600;font-size:0.75rem;margin-top:8px;">Reviews:</div>
    ${reviewHtml}
    <div class="dialog-btns">
      <button class="btn" onclick="showPRDialog()">返回</button>
      ${actionHtml}
    </div>`;
  ov.classList.add('show');
}

function doReviewPR(prId, status) {
  try {
    sys.reviewPR(prId, getChef().author, status);
    closeDialog();
    render();
    if (status === 'approved') {
      toast('已通过审核 (Approved)');
      unlockAchievement('first_pr_review');
    } else {
      toast('已请求修改 (Changes Requested)');
    }
    // 重新打开 PR 详情
    setTimeout(() => showPRDetail(prId), 100);
  } catch(e) {
    toast(e.message, true);
  }
}

function doMergePR(prId) {
  try {
    const result = sys.mergePR(prId);
    const repo = getChef().repo;
    const sourceBranch = result.pr.source;
    const targetBranch = result.pr.target;
    // 切换到目标分支
    if (repo.currentBranch() !== targetBranch) {
      repo.checkout(targetBranch);
    }
    // 同步远端最新状态并拉取到本地（PR 合并后本地 main 应跟进）
    sys.pull(repo, getChef().author);
    // 强制清理源分支（无论 prune 是否生效）
    repo.remoteRefs.delete('origin/' + sourceBranch);
    if (repo.branches.has(sourceBranch)) {
      repo.branches.delete(sourceBranch);
    }
    resetWorkingRecipe();
    closeDialog();
    render();
    toast(`PR #${prId} 已合并到 ${targetBranch}`);
    unlockAchievement('first_pr_merge');
  } catch(e) {
    console.error('[doMergePR] error:', e);
    toast(e.message, true);
  }
}

// ===================== 冲突解决 UI =====================
function showConflictResolver(prId) {
  const pr = sys.pullRequests.find(p => p.id === prId);
  if (!pr) return;
  const sourceTip = sys.remote.branches.get(pr.source);
  const targetTip = sys.remote.branches.get(pr.target);
  if (!sourceTip || !targetTip) return;

  const baseId = findMergeBase(sys.remote, targetTip, sourceTip);
  const baseRecipe = sys.remote.commits.get(baseId)?.recipe || [];
  const targetRecipe = sys.remote.commits.get(targetTip)?.recipe || [];
  const sourceRecipe = sys.remote.commits.get(sourceTip)?.recipe || [];
  const { conflicts } = mergeRecipes(baseRecipe, targetRecipe, sourceRecipe);

  if (!conflicts.length) { toast('没有需要解决的冲突'); showPRDetail(prId); return; }

  const ov = document.getElementById('dialogOverlay'), dl = document.getElementById('dialog');

  let conflictRows = '';
  for (let i = 0; i < conflicts.length; i++) {
    const c = conflicts[i];
    const oursImg = c.ours !== undefined ? `<img src="${getIngredientImg(c.ours)}" style="width:32px;height:20px;object-fit:contain;vertical-align:middle;"> ${getIngredientName(c.ours)}` : '<span style="color:var(--text-3);">（已删除）</span>';
    const theirsImg = c.theirs !== undefined ? `<img src="${getIngredientImg(c.theirs)}" style="width:32px;height:20px;object-fit:contain;vertical-align:middle;"> ${getIngredientName(c.theirs)}` : '<span style="color:var(--text-3);">（已删除）</span>';

    conflictRows += `
      <div style="padding:4px 0;margin:6px 0;">
        <div style="font-size:0.7rem;color:var(--text-3);margin-bottom:4px;">第 ${c.index + 1} 层冲突：</div>
        <div style="display:flex;gap:8px;align-items:stretch;">
          <label style="flex:1;cursor:pointer;padding:8px;border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:0.75rem;" id="conflict-${i}-ours">
            <input type="radio" name="conflict-${i}" value="ours" onchange="highlightConflictChoice(${i})" checked>
            <div style="display:flex;align-items:center;gap:4px;justify-content:center;white-space:nowrap;">
              <span style="font-weight:600;color:var(--accent);">${pr.target}:</span> ${oursImg}
            </div>
          </label>
          <label style="flex:1;cursor:pointer;padding:8px;border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:0.75rem;" id="conflict-${i}-theirs">
            <input type="radio" name="conflict-${i}" value="theirs" onchange="highlightConflictChoice(${i})">
            <div style="display:flex;align-items:center;gap:4px;justify-content:center;white-space:nowrap;">
              <span style="font-weight:600;color:var(--green);">${pr.source}:</span> ${theirsImg}
            </div>
          </label>
        </div>
      </div>`;
  }

  dl.innerHTML = `
    <h3>解决冲突</h3>
    <div style="font-size:0.72rem;color:var(--text-2);margin-bottom:8px;">
      ${pr.source} 与 ${pr.target} 存在 ${conflicts.length} 处冲突，请逐一选择保留的版本：
    </div>
    ${conflictRows}
    <div class="dialog-btns" style="margin-top:12px;">
      <button class="btn" onclick="showPRDetail(${prId})">取消</button>
      <button class="btn dark" onclick="doResolveConflicts(${prId})">确认解决</button>
    </div>`;
  ov.classList.add('show');

  // 初始高亮
  setTimeout(() => { for (let i = 0; i < conflicts.length; i++) highlightConflictChoice(i); }, 0);
}

function highlightConflictChoice(idx) {
  const oursEl = document.getElementById(`conflict-${idx}-ours`);
  const theirsEl = document.getElementById(`conflict-${idx}-theirs`);
  if (!oursEl || !theirsEl) return;
  const radio = document.querySelector(`input[name="conflict-${idx}"]:checked`);
  if (radio && radio.value === 'ours') {
    oursEl.style.borderColor = 'var(--accent)';
    oursEl.style.background = 'var(--accent-soft)';
    theirsEl.style.borderColor = 'var(--border)';
    theirsEl.style.background = '';
  } else {
    theirsEl.style.borderColor = 'var(--green)';
    theirsEl.style.background = 'var(--green-soft)';
    oursEl.style.borderColor = 'var(--border)';
    oursEl.style.background = '';
  }
}

function doResolveConflicts(prId) {
  const pr = sys.pullRequests.find(p => p.id === prId);
  if (!pr) return;
  const sourceTip = sys.remote.branches.get(pr.source);
  const targetTip = sys.remote.branches.get(pr.target);
  if (!sourceTip || !targetTip) return;

  const baseId = findMergeBase(sys.remote, targetTip, sourceTip);
  const baseRecipe = sys.remote.commits.get(baseId)?.recipe || [];
  const targetRecipe = sys.remote.commits.get(targetTip)?.recipe || [];
  const sourceRecipe = sys.remote.commits.get(sourceTip)?.recipe || [];
  const { recipe: mergedRecipe, conflicts } = mergeRecipes(baseRecipe, targetRecipe, sourceRecipe);

  // 读取用户选择
  for (let i = 0; i < conflicts.length; i++) {
    const radio = document.querySelector(`input[name="conflict-${i}"]:checked`);
    const choice = radio ? radio.value : 'ours';
    const c = conflicts[i];
    mergedRecipe[c.index] = choice === 'theirs'
      ? (c.theirs !== undefined ? c.theirs : c.ours)
      : (c.ours !== undefined ? c.ours : c.theirs);
  }

  // 在远端 source 分支上创建一个解决冲突的 merge commit
  // 模拟：PR 作者将 target 合入 source 并手动解决冲突后 push
  const resolveId = sys.remote._id();
  sys.remote.commits.set(resolveId, {
    id: resolveId,
    msg: `resolve: 合并 ${pr.target} 到 ${pr.source}，解决 ${conflicts.length} 处冲突`,
    parents: [sourceTip, targetTip],
    recipe: mergedRecipe,
    author: pr.author
  });
  sys.remote.branches.set(pr.source, resolveId);

  // 同步到本地
  const repo = getChef().repo;
  sys.fetch(repo);

  closeDialog();
  render();
  toast(`冲突已解决，PR 现在可以合并`);
  unlockAchievement('first_conflict_resolve');
  // 重新打开 PR 详情
  setTimeout(() => showPRDetail(prId), 150);
}

function doReset() {
  if (!requireInit()) return;
  const history = getChef().repo.getHistory();
  if (history.length <= 1) { toast('已是第一个提交，无法回退', true); return; }
  // Show selection dialog (skip current HEAD and initial commit)
  const options = history.slice(1).filter(c => c.parents.length > 0);
  if (!options.length) { toast('没有可回退的存档', true); return; }
  const ov = document.getElementById('dialogOverlay'), dl = document.getElementById('dialog');
  let optHtml = options.map(c => {
    const author = c.author ? `[${c.author}]` : '';
    const recipeHtml = c.recipe ? renderRecipeInline(c.recipe) : '';
    return `<button class="btn" style="text-align:left;width:100%;margin-bottom:4px;" onclick="confirmReset('${c.id}')"><b>${c.msg}</b> <span style="color:#888;font-size:0.7rem">${author}</span><br>${recipeHtml}</button>`;
  }).join('');
  dl.innerHTML = `<h3>回退到哪个存档？(reset)</h3><p style="font-size:0.72rem;color:#888;">回退 = 删掉后面的存档，回到选中的版本。<b>未同步的存档会丢失！</b></p><div style="max-height:200px;overflow-y:auto;margin-bottom:0.7rem;">${optHtml}</div><div class="dialog-btns"><button class="btn" onclick="closeDialog()">取消</button></div>`;
  ov.classList.add('show');
}

function confirmReset(targetId) {
  try {
    getChef().repo.reset(targetId);
    resetWorkingRecipe();
    closeDialog();
    render();
    toast('reset → ' + getChef().repo.commits.get(targetId).msg);
    unlockAchievement('first_reset');
  } catch(e) { toast(e.message, true); }
}

function doRevert() {
  if (!requireInit()) return;
  const history = getChef().repo.getHistory();
  if (history.length <= 1) { toast('已是第一个提交，无法撤销', true); return; }
  // Can revert any commit except the initial one
  const options = history.filter(c => c.parents.length > 0);
  if (!options.length) { toast('没有可撤销的提交', true); return; }
  const ov = document.getElementById('dialogOverlay'), dl = document.getElementById('dialog');
  let optHtml = options.map(c => {
    const author = c.author ? `[${c.author}]` : '';
    const recipeHtml = c.recipe ? renderRecipeInline(c.recipe) : '';
    return `<button class="btn" style="text-align:left;width:100%;margin-bottom:4px;" onclick="confirmRevert('${c.id}')"><b>${c.msg}</b> <span style="color:#888;font-size:0.7rem">${author}</span><br>${recipeHtml}</button>`;
  }).join('');
  dl.innerHTML = `<h3>撤销哪个提交？(revert)</h3><p style="font-size:0.72rem;color:#888;">撤销 = 新增一个「反向操作」的存档，历史不变。<b>安全，适合已同步的提交。</b></p><div style="max-height:200px;overflow-y:auto;margin-bottom:0.7rem;">${optHtml}</div><div class="dialog-btns"><button class="btn" onclick="closeDialog()">取消</button></div>`;
  ov.classList.add('show');
}

function confirmRevert(targetId) {
  try {
    const id = getChef().repo.revert(targetId);
    resetWorkingRecipe();
    closeDialog();
    render();
    toast('revert → ' + getChef().repo.commits.get(id).msg);
    unlockAchievement('first_reset');
  } catch(e) { toast(e.message, true); }
}

function doPush() {
  try {
    sys.push(getChef().repo);
    render();
    toast('同步成功 — 存档已上传到远端');
    unlockAchievement('first_sync');
    if (currentChef === 'red') { _redPushed = true; if (_redCommitted && _redPushed) unlockAchievement('team_collab'); }
  } catch(e) { toast(e.message, true); }
}

function doFetch() {
  try {
    const branchBefore = getChef().repo.currentBranch();
    const n = sys.fetch(getChef().repo);
    if (getChef().repo.currentBranch() !== branchBefore) {
      resetWorkingRecipe();
    }
    render();
    toast(`远端发现 +${n} 个新存档`);
  }
  catch(e) { toast(e.message, true); }
}

function doPull() {
  try {
    const author = getChef().author;
    const result = sys.pull(getChef().repo, author);
    if (result.type === 'up-to-date') { render(); toast('已是最新'); return; }
    if (result.type === 'fast-forward') { resetWorkingRecipe(); render(); toast('已同步远端的新存档'); unlockAchievement('first_pull'); return; }
    if (result.type === 'auto-merge') { resetWorkingRecipe(); render(); toast('自动合并成功（改的是不同位置）'); unlockAchievement('first_pull'); return; }
    render();
    pendingConflictInfo = result;
    showConflictDialog(result);
    unlockAchievement('first_pull');
  } catch(e) { toast(e.message, true); }
}

// 同步按钮：pull 优先，再 push（符合 git 概念：先拉再推）
function doSync() {
  if (!getChef().initialized) { toast('请先克隆仓库', true); return; }

  // 检查工作区是否有未提交的修改
  const committed = getCommittedRecipe();
  const recipe = getChef().workingRecipe;
  const diff = diffRecipes(committed, recipe);
  const hasUncommitted = diff.some(d => d.type !== 'same');
  if (hasUncommitted) {
    const ov = document.getElementById('dialogOverlay'), dl = document.getElementById('dialog');
    dl.innerHTML = `<h3>工作区有未存档修改</h3><p style="font-size:0.78rem;color:#666;margin-bottom:0.6rem;">同步前需要先存档（commit）。请输入存档信息：</p><input id="syncCommitMsg" class="dialog-input" placeholder="描述这次改了什么" autofocus /><div class="dialog-btns" style="margin-top:0.8rem;"><button class="btn danger" onclick="closeDialog();discardAllChanges();doSync();">丢弃修改并同步</button><button class="btn" onclick="closeDialog()">取消</button><button class="btn dark" onclick="commitAndSync()">存档并同步</button></div>`;
    ov.classList.add('show');
    // Focus input and handle Enter key
    setTimeout(() => {
      const input = document.getElementById('syncCommitMsg');
      if (input) {
        input.focus();
        input.addEventListener('keydown', e => { if (e.key === 'Enter') commitAndSync(); });
      }
    }, 50);
    return;
  }

  // 先 fetch 获取远端最新状态，再判断 behind/ahead
  const branchBeforeSync = getChef().repo.currentBranch();
  sys.fetch(getChef().repo);
  // fetch 可能因远端分支被删而自动切到 main，需重置工作区
  if (getChef().repo.currentBranch() !== branchBeforeSync) {
    resetWorkingRecipe();
  }

  const behind = sys.getBehind(getChef().repo);
  const ahead = sys.getAhead(getChef().repo);

  if (behind > 0) {
    // 远端有新内容，先 pull（pull 内部含 fetch + merge）
    doPull();
    // pull 成功且本地仍有待推送时，自动继续 push
    setTimeout(() => {
      if (!pendingConflictInfo) {
        const stillAhead = sys.getAhead(getChef().repo);
        if (stillAhead > 0) doPush();
      }
    }, 50);
  } else if (ahead > 0) {
    doPush();
  } else {
    toast('已同步，无需操作');
  }
}

// 更新同步按钮标签
function updateSyncLabel() {
  const zhEl = document.getElementById('syncZh');
  const enEl = document.getElementById('syncEn');
  if (!zhEl || !enEl) return;
  if (!getChef().initialized) { zhEl.textContent = '同步'; enEl.textContent = 'sync'; return; }

  const ahead = sys.getAhead(getChef().repo);
  const behind = sys.getBehind(getChef().repo);

  if (!ahead && !behind) {
    zhEl.textContent = '同步';
    enEl.textContent = 'sync';
  } else {
    let badge = '';
    if (behind > 0) badge += `\u2193${behind} `;
    if (ahead > 0) badge += `\u2191${ahead}`;
    zhEl.textContent = '同步';
    enEl.textContent = `sync ${badge.trim()}`;
  }
}

function updatePRBadge() {
  const el = document.getElementById('prBadge');
  if (!el) return;
  const openCount = sys.getOpenPRs().length;
  if (openCount > 0) {
    el.textContent = openCount;
    el.style.display = '';

function showConflictDialog(conflictResult) {
  const ov = document.getElementById('dialogOverlay'), dl = document.getElementById('dialog');
  const hasRecipeConflict = conflictResult && conflictResult.conflicts && conflictResult.conflicts.length > 0;
  const myLabel = currentChef === 'red' ? '小红' : '小蓝';
  const theirLabel = currentChef === 'red' ? '小蓝' : '小红';

  let recipeHtml = '';
  if (hasRecipeConflict) {
    const { localRecipe, remoteRecipe, conflicts } = conflictResult;
    const conflictIndices = new Set(conflicts.map(c => c.index));

    let localHtml = '';
    for (let i = 0; i < localRecipe.length; i++) {
      const cls = conflictIndices.has(i) ? ' conflict' : '';
      localHtml += `<span class="preview-layer${cls}"><img src="${getIngredientImg(localRecipe[i])}">${getIngredientName(localRecipe[i])}</span>`;
    }

    let remoteHtml = '';
    for (let i = 0; i < remoteRecipe.length; i++) {
      const cls = conflictIndices.has(i) ? ' conflict' : '';
      remoteHtml += `<span class="preview-layer${cls}"><img src="${getIngredientImg(remoteRecipe[i])}">${getIngredientName(remoteRecipe[i])}</span>`;
    }

    recipeHtml = `
      <div class="recipe-compare">
        <div class="side">
          <div class="side-label">${myLabel}的汉堡</div>
          <div class="sandwich-preview">${localHtml}</div>
        </div>
        <div class="side">
          <div class="side-label">${theirLabel}的汉堡</div>
          <div class="sandwich-preview">${remoteHtml}</div>
        </div>
      </div>`;
  }

  dl.innerHTML = `
    <h3>合并冲突</h3>
    <p>${myLabel}和${theirLabel}都修改了同一层食材。${hasRecipeConflict ? `${conflictResult.conflicts.length} 层冲突（红框标出）：` : 'Git 无法自动合并，需要你决定怎么处理：'}</p>
    ${recipeHtml}
    <div class="dialog-btns" style="flex-direction:column;align-items:stretch;">
      <button class="btn" onclick="resolveConflict('mine')">保留${myLabel}的</button>
      <button class="btn" onclick="resolveConflict('theirs')">保留${theirLabel}的</button>
      <button class="btn active" onclick="resolveConflict('both')">合并两者</button>
    </div>`;
  ov.classList.add('show');
}

function resolveConflict(strategy) {
  const author = getChef().author;
  const id = sys.resolveConflict(getChef().repo, strategy, pendingConflictInfo, author);
  pendingConflictInfo = null;
  resetWorkingRecipe();
  closeDialog();
  render();
  const labels = { mine: '保留小蓝的', theirs: '保留小红的', both: '合并两者' };
  toast(`冲突已解决: ${labels[strategy]}`);
}

function doClone() {
  if (getChef().initialized) {
    toast('已经克隆过了', true);
    return;
  }
  const repo = getChef().repo;
  const remote = sys.remote;
  for (const [id, c] of remote.commits) {
    if (!repo.commits.has(id)) {
      repo.commits.set(id, { ...c, recipe: c.recipe ? [...c.recipe] : undefined });
    }
  }
  for (const [b, bid] of remote.branches) {
    repo.branches.set(b, bid);
    repo.remoteRefs.set('origin/' + b, bid);
    if (!repo.branchColors.has(b)) repo.branchColors.set(b, remote.branchColors.get(b) || '#2563eb');
  }
  // 默认 checkout main；如果 main 仍在初始提交（空配方），自动切换到有内容的分支
  repo.HEAD = { type: 'branch', ref: 'main' };
  const mainTip = repo.branches.get('main');
  const mainCommit = repo.commits.get(mainTip);
  if (mainCommit && mainCommit.parents.length === 0) {
    // main 还是初始空提交，找一个有真实内容的分支
    for (const [b, bid] of repo.branches) {
      if (b === 'main') continue;
      const bc = repo.commits.get(bid);
      if (bc && bc.parents.length > 0) {
        repo.HEAD = { type: 'branch', ref: b };
        break;
      }
    }
  }
  repo.counter = Math.max(repo.counter, remote.counter);
  getChef().initialized = true;
  resetWorkingRecipe();
  render();
  toast('clone 成功 — 已从远端拉取项目到本地');
  unlockAchievement('first_clone');
}

// === Dialog utils ===
function openDialog(title, ph, fn, opts) {
  const ov = document.getElementById('dialogOverlay'), dl = document.getElementById('dialog');
  dl.innerHTML = `<h3>${title}</h3><input id="dlgI" placeholder="${ph}" autofocus><div class="dlg-error" id="dlgError" style="display:none;color:#c0392b;font-size:0.75rem;margin-top:4px;"></div><div class="dialog-btns"><button class="btn" onclick="closeDialog()">取消</button><button class="btn active" onclick="cfmDlg()">确定</button></div>`;
  ov.classList.add('show'); dl._fn = fn; dl._validate = opts?.validate || null;
  setTimeout(() => { const i = document.getElementById('dlgI'); i.focus(); i.onkeydown = e => { if (e.key==='Enter') cfmDlg(); if (e.key==='Escape') closeDialog(); }; }, 50);
}
function cfmDlg() {
  const input = document.getElementById('dlgI');
  const v = input.value.trim();
  const dl = document.getElementById('dialog');
  const errEl = document.getElementById('dlgError');
  // 如果有 validate 函数，先校验
  if (dl._validate) {
    const errMsg = dl._validate(v);
    if (errMsg) {
      // 校验不通过：输入框错误态 + 显示错误信息，弹窗保持
      input.style.border = '1.5px solid #c0392b';
      input.style.background = '#fff5f5';
      errEl.textContent = errMsg;
      errEl.style.display = 'block';
      input.focus();
      // 用户重新输入时清除错误态
      input.oninput = () => { input.style.border = ''; input.style.background = ''; errEl.style.display = 'none'; };
      return;
    }
  }
  dl._fn?.(v);
  closeDialog();
}
function closeDialog() { document.getElementById('dialogOverlay').classList.remove('show'); }
document.getElementById('dialogOverlay').onclick = e => { if (e.target === e.currentTarget) closeDialog(); };

function toast(m, err) {
  const el = document.getElementById('toast');
  el.innerHTML = m; el.className = 'toast show' + (err ? ' error' : '');
  clearTimeout(el._t); el._t = setTimeout(() => el.className = 'toast', 2000);
}
function toastImg(id) {
  return `<img src="${getIngredientImg(id)}" style="height:18px;width:auto;vertical-align:middle;margin:0 2px;">`;
}

function toggleAdvanced() {
  const el = document.getElementById('advancedBtns');
  const label = el.previousElementSibling || el.parentElement.querySelector('.ctrl-label');
  if (el.style.display === 'none') {
    el.style.display = 'flex';
    label.textContent = '进阶 ▾';
  } else {
    el.style.display = 'none';
    label.textContent = '进阶 ▸';
  }
}

// ACHIEVEMENT SYSTEM
// ================================================================
const achievements = [
  { id: 'first_clone',    name: '初来乍到',   desc: '完成第一次克隆', done: false },
  { id: 'first_commit',   name: '第一份汉堡', desc: '完成第一次存档', done: false },
  { id: 'first_sync',     name: '送出厨房',   desc: '完成第一次同步', done: false },
  { id: 'switch_red',     name: '换个视角',   desc: '第一次切换到小红视角', done: false },
  { id: 'team_collab',    name: '团队协作',   desc: '小红也完成一次存档 + 同步', done: false },
  { id: 'first_pull',     name: '远端有货',   desc: '同步时拉到了别人的新存档', done: false },
  { id: 'ai_fail',        name: 'AI 翻车了',  desc: '第一次触发 AI 翻车（生成了坏食材）', done: false },
  { id: 'first_reset',    name: '时光倒流',   desc: '完成第一次回退', done: false },
  { id: 'first_branch',   name: '开辟新路',   desc: '创建第一个新分支', done: false },
  { id: 'first_merge',    name: '殊途同归',   desc: '完成第一次合并', done: false },
  { id: 'first_pr',       name: '正式提案',   desc: '创建第一个 Pull Request', done: false },
  { id: 'first_pr_review', name: '代码门神',  desc: '完成第一次 PR 审核', done: false },
  { id: 'first_pr_merge', name: '审核通过',   desc: '合并第一个通过审核的 PR', done: false },
  { id: 'first_conflict_resolve', name: '化解冲突', desc: '第一次手动解决 PR 中的代码冲突', done: false },
  { id: 'canary_pub',     name: '试营业',    desc: '完成第一次试吃发布', done: false },
  { id: 'full_pub',       name: '正式开业',   desc: '完成第一次全店发布', done: false },
  { id: 'rollback_fix',   name: '翻车善后',   desc: '发布后出现客诉，然后成功回滚', done: false },
  { id: 'graduate',       name: '毕业厨师',   desc: '解锁以上所有成就', done: false },
];

// Track sub-conditions for team_collab
let _redCommitted = false;
let _redPushed = false;
// Track sub-condition for rollback_fix
let _hadBadProduction = false;

function getAchievementCount() {
  return achievements.filter(a => a.done).length;
}

function updateAchProgress() {
  const el = document.getElementById('achProgress');
  if (el) el.textContent = ` ${getAchievementCount()}/${achievements.length}`;
}

function unlockAchievement(id) {
  const ach = achievements.find(a => a.id === id);
  if (!ach || ach.done) return;
  ach.done = true;
  saveAchievements();
  // Show special toast
  const el = document.getElementById('toast');
  el.innerHTML = `成就解锁：${ach.name}`;
  el.className = 'toast show achievement';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 2800);
  updateAchProgress();
  // Check graduate
  checkGraduate();
}

function saveAchievements() {
  const data = achievements.reduce((o, a) => { if (a.done) o[a.id] = true; return o; }, {});
  try { localStorage.setItem('git-kitchen-achievements', JSON.stringify(data)); } catch(e) {}
}

function loadAchievements() {
  try {
    const data = JSON.parse(localStorage.getItem('git-kitchen-achievements') || '{}');
    achievements.forEach(a => { if (data[a.id]) a.done = true; });
  } catch(e) {}
  updateAchProgress();
}

function checkGraduate() {
  const allOthers = achievements.filter(a => a.id !== 'graduate');
  if (allOthers.every(a => a.done)) {
    setTimeout(() => unlockAchievement('graduate'), 1200);
  }
}

function showAchievementPanel() {
  const ov = document.getElementById('dialogOverlay');
  const dl = document.getElementById('dialog');
  const count = getAchievementCount();
  let listHtml = achievements.map(a => {
    const cls = a.done ? 'achievement-item done' : 'achievement-item';
    const check = a.done ? '✓' : '○';
    return `<div class="${cls}"><div class="ach-info"><div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}</div></div><span class="ach-check">${check}</span></div>`;
  }).join('');
  dl.innerHTML = `<div class="achievement-panel"><button class="ach-close" onclick="closeDialog()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg></button><h3>闯关成就</h3><div class="ach-subtitle">进度：${count} / ${achievements.length}</div><div class="achievement-list">${listHtml}</div><div class="dialog-btns" style="margin-top:0.8rem;"><button class="btn" onclick="resetAchievements()">重置</button></div></div>`;
  ov.classList.add('show');
}

function resetAchievements() {
  achievements.forEach(a => a.done = false);
  try { localStorage.removeItem('git-kitchen-achievements'); } catch(e) {}
  updateAchProgress();
  closeDialog();
  toast('成就已重置');
}

// Initial render
loadAchievements();
render();
